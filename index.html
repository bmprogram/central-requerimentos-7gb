  const SEMANA = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
  const U = {
    data: function (iso) {
      if (!iso) return null;
      const p = String(iso).split("-").map(Number);
      if (p.length !== 3 || p.some(isNaN) || p[0] < 1900) return null;
      return new Date(p[0], p[1] - 1, p[2]);
    },
    iso: function (d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
    fmt: function (d) { return d ? String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear() : ""; },
    soma: function (d, n) { const r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate() + n); return r; },
    somaMeses: function (d, n) {
      const dia = d.getDate();
      const r = new Date(d.getFullYear(), d.getMonth() + n, 1);
      const ult = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
      r.setDate(Math.min(dia, ult));
      return r;
    },
    hoje: function () { const h = new Date(); return new Date(h.getFullYear(), h.getMonth(), h.getDate()); },
    dias: function (a, b) { return Math.round((b - a) / 864e5); },
    extenso: function (d) { return d.getDate() + " de " + MESES[d.getMonth()] + " de " + d.getFullYear(); },
    semana: function (d) { return SEMANA[d.getDay()]; },
    /* retorno de afastamento de n meses: dia de igual número no mês final; se esse dia
       não existir (ex.: 31/02), o dia 1º do mês seguinte (Código Civil, art. 132, § 3º) */
    retornoMeses: function (d, n) {
      const r = new Date(d.getFullYear(), d.getMonth() + n, 1);
      const ult = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
      return d.getDate() <= ult ? new Date(r.getFullYear(), r.getMonth(), d.getDate()) : new Date(r.getFullYear(), r.getMonth() + 1, 1);
    },
    uteisAntes: function (d, n) {
      const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      let c = 0;
      while (c < n) { r.setDate(r.getDate() - 1); const w = r.getDay(); if (w !== 0 && w !== 6) c++; }
      return r;
    },
    /* anos, meses e dias entre a e b (b >= a): conta os meses inteiros (o dia que não
       existe no mês, como 31/02, vira o último dia do mês) e depois os dias que sobram */
    intervalo: function (a, b) {
      if (b < a) return { anos: 0, meses: 0, dias: 0 };
      let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
      if (U.somaMeses(a, m) > b) m--;
      return { anos: Math.floor(m / 12), meses: m % 12, dias: U.dias(U.somaMeses(a, m), b) };
    }
  };

  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("visivel");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("visivel"); }, 2200);
  }
  function copiarFallback(txt) {
    try {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function copiar(txt, msg) {
    const ok = function () { toast(msg || "Copiado"); };
    const falhou = function () { toast("Não foi possível copiar: selecione o texto e use Ctrl+C"); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(ok, function () { if (copiarFallback(txt)) ok(); else falhou(); });
    } else if (copiarFallback(txt)) { ok(); } else { falhou(); }
  }

  /* copia com formatação (o quadro OBJETO vai como tabela para o editor do SEI) */
  function copiarRico(html, texto, msg) {
    let ok = false;
    const aoCopiar = function (e) {
      e.clipboardData.setData("text/html", html);
      e.clipboardData.setData("text/plain", texto);
      e.preventDefault();
    };
    try {
      document.addEventListener("copy", aoCopiar);
      ok = document.execCommand("copy");
    } catch (e) { ok = false; }
    document.removeEventListener("copy", aoCopiar);
    if (ok) toast(msg || "Copiado"); else copiar(texto, msg);
  }

  const numerica = function (op) { return /^\d/.test(String(op)); };

  function textoOpcoes(lista) {
    const partes = lista.map(function (n) { return n + " (" + (MODELO_ROTULO[n] || "") + ")"; });
    return partes.length > 1 ? partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1] : (partes[0] || "");
  }
  function rotuloOpcao(g) {
    if (!numerica(g.opcao)) return g.opcaoRotulo || g.opcao;
    if (g.opcaoJunto) return "X nas opções " + textoOpcoes([g.opcao, g.opcaoJunto]);

  /* A navegação é feita por script, e não pelo link em si, para funcionar em
     qualquer lugar: arquivo aberto no computador, intranet ou painel de
     pré-visualização (onde o link "#/..." tiraria o quadro da página). */
  let destinoAtual = null;
  function lerHash() {
    try { return decodeURIComponent((location.hash || "").replace(/^#\/?/, "")); } catch (e) { return ""; }
  }
  function navegar(destino, substituir) {
    destino = destino || "";
    try {
      const alvo = "#/" + destino;
      if (location.hash !== alvo) {
        if (substituir) history.replaceState(null, "", alvo); else history.pushState(null, "", alvo);
      }
    } catch (e) { /* sem histórico disponível: navega só em memória */ }
    rota(destino);
  }
  function rota(destino) {
    if (destino == null) destino = lerHash();
    destinoAtual = destino;
    const partes = destino.split("/");
    const pagina = Object.prototype.hasOwnProperty.call(ROTAS, partes[0]) ? partes[0] : "";
    $$(".menu a").forEach(function (a) {
      const ativo = a.getAttribute("data-rota") === (pagina === "guia" ? "" : pagina);
      a.classList.toggle("ativo", ativo);
      if (ativo) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    atualizarGeradorAtual = null;
    ROTAS[pagina](partes[1] || "");
    window.scrollTo(0, 0);
  }

  const PARADAS = {};
  "a o as os de da do das dos e em no na nos nas um uma uns umas para pra por com meu minha meus minhas quero queria preciso pedir pedido requerer requerimento sobre como fazer tirar ter".split(" ")
    .forEach(function (p) { PARADAS[p] = true; });
  function termos(q) { return norm(q).split(/[^a-z0-9]+/).filter(function (t) { return t && !PARADAS[t]; }); }
  function pontuar(g, ts) {
    const tit = norm(g.titulo), tags = norm(g.tags.join(" | ")), txt = norm(g.resumo + " " + (g.quando || "") + " " + CAT[g.categoria].nome);
    const nums = opcoesDoGuia(g);
    const numsN = nums.map(function (n) { return String(Number(n)); });
    let total = 0;
    for (let i = 0; i < ts.length; i++) {
      const t = ts[i];
      const raiz = t.length > 4 && t.charAt(t.length - 1) === "s" ? t.slice(0, -1) : t;
      let p = 0;
      if (/^\d+$/.test(t)) {
        /* número inteiro: "07" não pode casar com "20741" */
        const inteiro = new RegExp("(^|[^0-9])" + t + "($|[^0-9])");
        if (numsN.indexOf(String(Number(t))) >= 0) p = 6;
        else if (inteiro.test(tit) || inteiro.test(tags)) p = 2;
      } else if (t.length === 1) {
        /* letra solta (ex.: "anexo j"): só vale como palavra inteira */
        const palavra = new RegExp("(^|[^a-z0-9])" + t + "($|[^a-z0-9])");
        if (palavra.test(tit)) p = 4;
        else if (palavra.test(tags)) p = 3;
      } else if (tit.indexOf(raiz) >= 0) p = 4;
      else if (tags.indexOf(raiz) >= 0) p = 3;
      else if (txt.indexOf(raiz) >= 0) p = 1;
      if (!p) return 0;
      total += p;
    }
    /* a frase inteira no título ou nas palavras-chave vale mais */
    if (ts.length > 1) {
      const frase = ts.join(" ");
      if (tit.indexOf(frase) >= 0 || tags.indexOf(frase) >= 0) total += 5;
    }
    return total;
  }
  /* opções do quadro OBJETO que casam com a busca (usado quando nenhum guia casa) */
  function opcoesDoModelo(ts) {
    if (!ts.length) return [];
    return MODELO.filter(function (o) {
      const alvo = norm(o[1]);
      return ts.every(function (t) {
        if (/^\d+$/.test(t)) return Number(t) === Number(o[0]);
        const raiz = t.length > 4 && t.charAt(t.length - 1) === "s" ? t.slice(0, -1) : t;
        return alvo.indexOf(raiz) >= 0;
      });
    });
  }
  function listaDoModelo(ops) {
    return '<ul class="vazio-op">' + ops.map(function (o) {
      const gs = GUIAS.filter(function (g) { return opcoesDoGuia(g).indexOf(o[0]) >= 0; });
      return "<li><b>" + esc(o[0]) + "</b>( ) " + esc(o[1]) + " — " +
        (gs.length ? gs.map(function (g) { return '<a href="#/guia/' + g.id + '">' + esc(g.titulo) + "</a>"; }).join(", ") : '<span class="mudo">sem guia nesta versão</span>') +
        "</li>";
    }).join("") + "</ul>";
  }

    $$(".filtros button").forEach(function (b) {

    let base = GUIAS.filter(function (g) { return estado.cat === "todos" || g.categoria === estado.cat; });

      if (!achados.length) {
        info.innerHTML = "";

  /* formulários .docx embutidos no arquivo */
  const ARQ = typeof ARQUIVOS !== "undefined" ? ARQUIVOS : {};
  function formulariosHTML(g) {
    const lista = (g.formularios || []).filter(function (id) { return FORMULARIOS[id]; });
    if (!lista.length) return "";
    return '<section class="bloco no-print" aria-labelledby="t-form"><h2 id="t-form">Formulários para baixar</h2>' +
      '<p class="bloco-sub">' + esc(g.formulariosSub || "Modelos em Word (.docx): preencha, assine com " + ASSINATURA + " e inclua no processo.") + "</p>" +
      '<ul class="formularios">' + lista.map(function (id) {
        const f = FORMULARIOS[id];
        return '<li><button type="button" class="form-baixar" data-form="' + id + '">' + ic("documento", "form-ic") +
          '<span class="form-txt"><strong>' + esc(f.titulo) + "</strong><small>" + esc(f.arquivo) + (f.nota ? " · " + esc(f.nota) : "") + "</small></span>" +
          ic("baixar", "form-seta") + "</button></li>";
      }).join("") + "</ul></section>";
  }
  function baixarFormulario(id) {
    const f = FORMULARIOS[id], b64 = f ? ARQ[f.arquivo] : null;
    if (!b64) { toast("Formulário indisponível nesta versão do arquivo"); return; }
    try {
      const bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }));
      const a = document.createElement("a");
      a.href = url; a.download = f.arquivo; a.style.display = "none";
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      toast("Baixando " + f.arquivo);
    } catch (e) {
      toast("Não foi possível baixar aqui. Abra o arquivo no navegador e tente de novo.");
    }
  }

  function semGeradorHTML(g) {
    let txt;
    if (g.semRequerimento) {
      txt = g.semRequerimento;
    } else if (g.opcao === "—") {
      txt = "Este assunto não tem requerimento individual: o processo é iniciado pelo órgão interessado. Use os passos acima para acompanhar.";
    } else {
      txt = "Este pedido não usa o formulário padrão. Modelo a utilizar: " + (g.opcaoRotulo || "veja os passos acima") + ". Preencha-o no SEI seguindo os passos e confira a lista de documentos.";
    }
    return '<section class="bloco bloco-aviso">' + ic("info") + "<p>" + esc(txt) + "</p></section>";
  }

    let ctrl;
    if (c.tipo === "lista") {
      ctrl = "<select " + attrs + '><option value="">Selecione</option>' + c.opcoes.map(function (o) {
        const r = Array.isArray(o) ? o[0] : o;
        return "<option" + (r === valor ? " selected" : "") + ">" + esc(r) + "</option>";
      }).join("") + "</select>";
    } else if (c.tipo === "area") {
      ctrl = "<textarea " + attrs + ' rows="3" placeholder="' + esc(c.ex || "") + '">' + esc(valor || "") + "</textarea>";
    } else {
      const tipo = c.tipo === "data" ? "date" : (c.tipo === "numero" ? "number" : "text");
      const extra = (c.min != null ? ' min="' + c.min + '"' : "") + (c.max != null ? ' max="' + c.max + '"' : "") +
        (c.lista ? ' list="dl-' + c.lista + '"' : "") + (c.tipo === "numero" ? ' inputmode="numeric"' : "");
      ctrl = "<input " + attrs + ' type="' + tipo + '" value="' + esc(valor || "") + '" placeholder="' + esc(c.ex || "") + '"' + extra + ">";
    }
    return '<label class="campo' + (c.tipo === "area" || c.largo ? " largo" : "") + '" for="' + id + '"><span>' + esc(c.rotulo) + (c.opcional ? " <em>(opcional)</em>" : "") + "</span>" + ctrl + "</label>";
  }

  function datalistPostos() {
    return '<datalist id="dl-postos">' + POSTOS.map(function (p) { return '<option value="' + esc(p) + '">'; }).join("") + "</datalist>";
  }

  /* gerador para requerimentos com modelo próprio (fora do quadro OBJETO do SEI) */
  const CAMPOS_DADOS = {
    nome: { id: "nome", rotulo: "Nome completo", tipo: "texto" },
    posto: { id: "posto", rotulo: "Posto/Grad.", tipo: "texto", lista: "postos", ex: "Ex.: 2º Sargento BM" },
    matricula: { id: "matricula", rotulo: "Matrícula", tipo: "texto" },
    rg: { id: "rg", rotulo: "RG (militar)", tipo: "texto" },
    ome: { id: "ome", rotulo: "OME", tipo: "texto", ex: "Ex.: 2ª SB/7º GB" },
    cpf: { id: "cpf", rotulo: "CPF", tipo: "texto", ex: "000.000.000-00" },
    fone: { id: "fone", rotulo: "Telefone", tipo: "texto", ex: "(81) 90000-0000" },
    endereco: { id: "endereco", rotulo: "Endereço", tipo: "texto", largo: true, ex: "Rua, nº, bairro, cidade/PE, CEP" }
  };
  const DADOS_PADRAO = ["nome", "posto", "matricula", "rg", "ome", "cpf", "fone"];
  function geradorProprioHTML(g) {
    const m = g.minuta, pr = m.proprio;
    const d = store.get("dados", {});
    return '<section class="bloco gerador" id="gerador" aria-labelledby="t-gerador">' +
      '<div class="bloco-cab"><h2 id="t-gerador">Monte o requerimento</h2><span class="estado-txt" id="estado-txt"></span></div>' +
      '<p class="bloco-sub">' + esc(pr.sub) + " Nada é enviado pela internet — os dados ficam só neste navegador.</p>" +
      datalistPostos() +
      '<fieldset class="grupo-campos"><legend>' + ic("usuario") + "Seus dados</legend><div class=\"campos\">" +
        (pr.dados || DADOS_PADRAO).map(function (k) {
          return campo(CAMPOS_DADOS[k], k === "ome" ? (d.ome || CONFIG.unidadeSigla) : d[k], "d");
        }).join("") +
      "</div></fieldset>" +
      '<fieldset class="grupo-campos"><legend>' + ic("documento") + esc(pr.legenda || "Dados do pedido") + "</legend><div class=\"campos\">" +
        m.campos.map(function (c) { return campo(c, "", "p"); }).join("") +
        campo({ id: "vez", rotulo: "Vez que requer", tipo: "lista", opcoes: ["1ª", "2ª", "3ª", "4ª", "5ª"] }, "1ª", "x") +
      "</div></fieldset>" +
      '<div class="avisos" id="avisos" aria-live="polite"></div>' +
      '<div class="saidas saidas-uma">' +
        '<article class="saida">' +
          "<header><h3>" + esc(pr.titulo) + '</h3><button type="button" class="btn btn-mini" data-copiar="doc">' + ic("copiar") + "Copiar tudo</button></header>" +
          '<div class="papel req" id="out-texto"></div>' +
        "</article>" +
      "</div>" +
    "</section>";
  }

  function geradorHTML(g) {
    const m = g.minuta;
    if (m.proprio) return geradorProprioHTML(g);
    const d = store.get("dados", {});
    return '<section class="bloco gerador" id="gerador" aria-labelledby="t-gerador">' +
      '<div class="bloco-cab"><h2 id="t-gerador">Monte o requerimento</h2><span class="estado-txt" id="estado-txt"></span></div>' +
      '<p class="bloco-sub">Preencha os campos: o requerimento sai no formato do modelo do SEI, com o X na opção certa. Nada é enviado pela internet — os dados ficam só neste navegador.</p>' +
      datalistPostos() +
      '<fieldset class="grupo-campos"><legend>' + ic("usuario") + "Seus dados — item 1</legend><div class=\"campos\">" +
        campo({ id: "nome", rotulo: "Nome completo", tipo: "texto" }, d.nome, "d") +
        campo({ id: "rg", rotulo: "RG (militar)", tipo: "texto" }, d.rg, "d") +
        campo({ id: "posto", rotulo: "Posto/Grad.", tipo: "texto", lista: "postos", ex: "Ex.: 2º Sargento BM" }, d.posto, "d") +
        campo({ id: "ome", rotulo: "OME", tipo: "texto", ex: "Ex.: 2ª SB/7º GB" }, d.ome || CONFIG.unidadeSigla, "d") +
        campo({ id: "matricula", rotulo: "Matrícula", tipo: "texto" }, d.matricula, "d") +
        campo({ id: "fone", rotulo: "Telefone", tipo: "texto", ex: "(81) 90000-0000" }, d.fone, "d") +
        campo({ id: "endereco", rotulo: "Endereço", tipo: "texto", largo: true, ex: "Rua, nº, bairro, cidade/PE, CEP" }, d.endereco, "d") +
      "</div></fieldset>" +
      '<fieldset class="grupo-campos"><legend>' + ic("documento") + "Dados do pedido — Especificar</legend><div class=\"campos\">" +
        m.campos.map(function (c) { return campo(c, "", "p"); }).join("") +
      "</div><div class=\"campos\">" +
        campo({ id: "vez", rotulo: "Vez que requer — item 4", tipo: "lista", opcoes: ["1ª", "2ª", "3ª", "4ª", "5ª"] }, "1ª", "x") +
        '<div id="campo-anterior" hidden>' + campo({ id: "anterior", rotulo: "Processo anterior (nº SEI)", tipo: "texto" }, "", "x") + "</div>" +
        campo({ id: "dest", rotulo: "Destinatário — autoridade que decide este assunto (altere só se orientado)", tipo: "texto", largo: true }, destinoDe(g, {}).linha, "x") +
      "</div></fieldset>" +
      '<div class="avisos" id="avisos" aria-live="polite"></div>' +
      '<div class="saidas">' +
        '<article class="saida">' +
          '<header><h3>Campo a campo, para preencher o modelo do SEI</h3></header>' +
          '<dl class="saida-form" id="out-form"></dl>' +
        "</article>" +
        '<article class="saida">' +
          '<header><h3>Requerimento completo</h3><button type="button" class="btn btn-mini" data-copiar="doc">' + ic("copiar") + "Copiar tudo</button></header>" +
          '<div class="papel req" id="out-texto"></div>' +
        "</article>" +
      "</div>" +
    "</section>";
  }

  function valorTexto(c, raw) {
    raw = raw == null ? "" : String(raw).trim();
    if (!raw) return "";
    if (c.tipo === "data") { const d = U.data(raw); return d ? U.fmt(d) : ""; }
    if (c.tipo === "numero" && c.unidade) return raw + " " + (Number(raw) === 1 ? c.unidade[0] : c.unidade[1]);
    if (c.tipo === "lista") {
      for (let i = 0; i < c.opcoes.length; i++) {
        const o = c.opcoes[i];
        if (Array.isArray(o) ? o[0] === raw : o === raw) return Array.isArray(o) ? o[1] : o;
      }
      return raw;
    }
    return raw.replace(/\s*\n+\s*/g, " ").replace(/[.;,\s]+$/, "");
  }

  /* modo: "txt" (texto puro), "html" (pré-visualização com destaques) ou "limpo" (HTML para colar no SEI) */
  function preencher(tpl, mapa, modo) {
    if (modo === true) modo = "html";
    if (!modo) modo = "txt";
    tpl = tpl.replace(/\[\[([\s\S]*?)\]\]/g, function (_, seg) {
      const ids = (seg.match(/\{(\w+)\}/g) || []).map(function (s) { return s.slice(1, -1); });
      return ids.every(function (id) { return mapa[id] && mapa[id].valor; }) ? seg : "";
    });
    return tpl.split(/(\{\w+\})/).map(function (parte) {
      if (!parte) return "";
      const m = parte.match(/^\{(\w+)\}$/);
      if (!m) return modo === "txt" ? parte : esc(parte);
      const it = mapa[m[1]];
      if (it && it.valor) {
        if (modo === "html") return '<span class="v">' + esc(it.valor) + "</span>";
        return modo === "limpo" ? esc(it.valor) : it.valor;
      }
      const rot = "[" + minusc(it ? it.rotulo : m[1]) + "]";
      if (modo === "html") return '<mark class="ph">' + esc(rot) + "</mark>";
      return modo === "limpo" ? esc(rot) : rot;
    }).join("");
  }

  /* documentos marcados na lista são citados em Especificar */
  const PREFIXO_DOC = /^(Depois da compra|Depois da promoção|Ao final|Para vistoria|Munição|Acessório|Aluno-aprendiz|Na adoção|No caso[^:]*):\s+/;
  /* não vão no pedido inicial: o que fica para depois e o que nem entra no SEI */
  const FORA_DO_PEDIDO = /^(Depois da compra|Depois da promoção|Ao final|Para vistoria|Munição):/;
  function docParaTexto(d) {
    let t = d.replace(PREFIXO_DOC, "");
    t = t.replace(/\s*\((?:quando|se |em caso|recomend)[^)]*\)/gi, "");
    return minusc(t);
  }
  function anexosMarcados(g) {
    const marcados = store.get("docs:" + g.id, []);
    return g.docs.map(function (d, i) { return marcados[i] && !/^Requerimento/.test(d) && !FORA_DO_PEDIDO.test(d) ? docParaTexto(d) : null; }).filter(Boolean);
  }
  let atualizarGeradorAtual = null;

  function marcadasDe(g, p) {
    const m = g.minuta;
    const lista = typeof m.marcar === "function" ? m.marcar(p) : (m.marcar || [g.opcao]);
    return lista.filter(function (n) { return MODELO_ROTULO[n]; });
  }

  /* quadro OBJETO do modelo, com X nas opções marcadas */
  function quadroObjeto(marcadas, modo) {
    const linha = function (o) {
      const x = marcadas.indexOf(o[0]) >= 0;
      if (modo === "txt") return o[0] + "(" + (x ? "X" : " ") + ") " + o[1];
      const txt = esc(o[0]) + "(" + (x ? "<b>X</b>" : "&nbsp;&nbsp;") + ") " + esc(o[1]);
      return x && modo === "html" ? '<span class="marcada">' + txt + "</span>" : txt;
    };
    if (modo === "txt") return MODELO.map(linha).join("\n");
    const corte = MODELO.findIndex(function (o) { return o[0] === "24"; });
    const metade = corte > 0 ? corte : Math.ceil(MODELO.length / 2);
    const col = function (itens) { return itens.map(linha).join("<br>"); };
    const td = modo === "limpo" ? '<td style="width:50%;vertical-align:top;padding:4px 6px;border:1px solid #000">' : "<td>";
    return (modo === "limpo" ? '<table style="width:100%;border-collapse:collapse;border:1px solid #000">' : '<table class="req-quadro">') +
      "<tr>" + td + col(MODELO.slice(0, metade)) + "</td>" + td + col(MODELO.slice(metade)) + "</td></tr></table>";
  }

  function textosProprios(g, d, p, x) {
    const m = g.minuta, pr = m.proprio;
    const mapa = {
      nome: { valor: d.nome ? d.nome.trim().toUpperCase() : "", rotulo: "nome completo" },
      posto: { valor: (d.posto || "").trim(), rotulo: "posto/graduação" },
      matricula: { valor: (d.matricula || "").trim(), rotulo: "matrícula" },
      rg: { valor: (d.rg || "").trim(), rotulo: "RG" },
      ome: { valor: (d.ome || "").trim(), rotulo: "OME" },
      cpf: { valor: (d.cpf || "").trim(), rotulo: "CPF" },
      fone: { valor: (d.fone || "").trim(), rotulo: "telefone" },
      endereco: { valor: (d.endereco || "").trim().replace(/[.;,\s]+$/, ""), rotulo: "endereço" },
      vez: { valor: x.vez || "1ª", rotulo: "" }
    };
    m.campos.forEach(function (c) { mapa[c.id] = { valor: valorTexto(c, p[c.id]), rotulo: c.rotulo }; });
    const f = function (s, modo) { return preencher(s, mapa, modo); };
    const local = (CONFIG.cidade || "[cidade]") + "-" + (CONFIG.uf || "PE") + ", em " + U.fmt(U.hoje()) + ".";

    /* quadro de documentos (Anexo C): a última coluna, nº do documento no SEI, é preenchida no SEI */
    const tabela = function (b, modo) {
      if (modo === "txt") {
        return b.cab.join(" | ") + "\n" + b.linhas.map(function (t, i) { return (i + 1) + " | " + t + " | ________"; }).join("\n");
      }
      const limpo = modo === "limpo";
      const borda = "border:1px solid #000;padding:4px 6px;vertical-align:top";
      const th = function (t, w) { return limpo ? '<th style="' + borda + ";width:" + w + '">' + esc(t) + "</th>" : '<th scope="col">' + esc(t) + "</th>"; };
      const td = function (t, cls) { return limpo ? '<td style="' + borda + '">' + t + "</td>" : "<td" + (cls ? ' class="' + cls + '"' : "") + ">" + t + "</td>"; };
      return (limpo ? '<table style="width:100%;border-collapse:collapse;border:1px solid #000">' : '<table class="req-tabela">') +
        "<thead><tr>" + th(b.cab[0], "8%") + th(b.cab[1], "67%") + th(b.cab[2], "25%") + "</tr></thead><tbody>" +
        b.linhas.map(function (t, i) {
          return "<tr>" + td(String(i + 1), "req-tab-n") + td(esc(t)) + td(limpo ? "&nbsp;" : '<span class="req-tab-sei">preencha no SEI</span>', "req-tab-sei-c") + "</tr>";
        }).join("") + "</tbody></table>";
    };

    const doc = function (modo) {
      if (modo === "txt") {
        const linhas = [];
        pr.blocos.forEach(function (b) {
          if (b.tipo === "linhas") linhas.push(b.txt.map(function (t) { return f(t, "txt"); }).join("\n"));
          else if (b.tipo === "local") linhas.push(local);
          else if (b.tipo === "assin") linhas.push("\n" + f(b.txt, "txt") + (b.sub ? "\n" + b.sub : ""));
          else if (b.tipo === "despacho") linhas.push("\n" + b.txt.join("\n"));
          else if (b.tipo === "fecho") linhas.push(b.txt.join("\n"));
          else if (b.tipo === "tabela") linhas.push(tabela(b, "txt"));
          else linhas.push((b.rot ? b.rot + " " : "") + f(b.txt, "txt"));
        });
        return linhas.join("\n\n");
      }
      const limpo = modo === "limpo";
      const par = function (conteudo, cls, estilo) {
        return "<p" + (!limpo && cls ? ' class="' + cls + '"' : "") + (limpo && estilo ? ' style="' + estilo + '"' : "") + ">" + conteudo + "</p>";
      };
      return pr.blocos.map(function (b) {
        if (b.tipo === "tit") return par("<b>" + f(b.txt, modo) + "</b>", "req-tit", "text-align:center");
        if (b.tipo === "sub") return par("<b>" + f(b.txt, modo) + "</b>", "req-sub", "text-align:center");
        if (b.tipo === "linhas") return par(b.txt.map(function (t) { return f(t, modo); }).join("<br>"), "req-linhas");
        if (b.tipo === "local") return par(esc(local));
        if (b.tipo === "assin") return par(f(b.txt, modo) + (b.sub ? "<br>" + esc(b.sub) : ""), "req-assin", "margin-left:100px;margin-top:36px");
        if (b.tipo === "despacho") return par(b.txt.map(function (t, i) { return i === 0 ? "<b>" + esc(t) + "</b>" : esc(t); }).join("<br>"), "req-despacho", "border:1px solid #000;padding:8px;margin-top:24px");
        if (b.tipo === "fecho") return par(b.txt.map(esc).join("<br>"), "req-fecho", "margin-left:40px");
        if (b.tipo === "tabela") return tabela(b, modo);
        return par((b.rot ? "<b>" + esc(b.rot) + "</b> " : "") + f(b.txt, modo));
      }).join("");
    };
    return { formHtml: "", campos: [], docPreview: doc("html"), docLimpo: doc("limpo"), docTxt: doc("txt") };
  }

  function gerarTextos(g, d, p, x) {
    const m = g.minuta;
    if (m.proprio) return textosProprios(g, d, p, x);
    const amparo = m.amparo || "";
    const pendente = /^\[/.test(amparo);
    const mapa = {
      nome: { valor: d.nome ? d.nome.trim().toUpperCase() : "", rotulo: "nome completo" },
      rg: { valor: (d.rg || "").trim(), rotulo: "RG" },
      posto: { valor: (d.posto || "").trim(), rotulo: "posto/graduação" },
      ome: { valor: (d.ome || "").trim(), rotulo: "OME" },
      matricula: { valor: (d.matricula || "").trim(), rotulo: "matrícula" },
      fone: { valor: (d.fone || "").trim(), rotulo: "telefone" },
      endereco: { valor: (d.endereco || "").trim().replace(/[.;,\s]+$/, ""), rotulo: "endereço" },
      dest: { valor: (x.dest || "").trim(), rotulo: "destinatário" },
      vez: { valor: x.vez || "1ª", rotulo: "" },
      anterior: { valor: (x.anterior || "").trim(), rotulo: "processo anterior" },
      amparo: { valor: pendente ? "" : amparo, rotulo: pendente ? amparo.replace(/^\[|\]$/g, "") : "amparo legal" },
      anexos: { valor: anexosMarcados(g).join("; "), rotulo: "" }
    };
    m.campos.forEach(function (c) { mapa[c.id] = { valor: valorTexto(c, p[c.id]), rotulo: c.rotulo }; });

    const marcadas = marcadasDe(g, p);
    const tpl = {
      espec: m.especificar + "." + (m.extra ? " " + m.extra.replace(/\.?$/, ".") : "") + "[[ Documentos anexos: {anexos}.]]",
      item1: [["Nome: {nome}", "RG: {rg};"], ["Posto/Grad.: {posto}", "OME: {ome}", "Mat.: {matricula}"], ["Fone: {fone};"], ["Endereço: {endereco};"]],
      item2: "Requer a V. S.ª, que se digne em conceder-lhe o(s) objeto(s) acima selecionado(s);",
      item3: "Tal solicitação encontra amparo legal {amparo};",
      item4: "É a {vez} vez que requer[[ (processo anterior nº {anterior})]].",
      local: (CONFIG.cidade || "[cidade]") + "-" + (CONFIG.uf || "PE") + ", em " + U.fmt(U.hoje()) + "."
    };
    const f = function (s, modo) { return preencher(s, mapa, modo); };
    const item1 = function (modo) {
      const sep = modo === "txt" ? "   " : "&emsp;", br = modo === "txt" ? "\n" : "<br>";
      return tpl.item1.map(function (partes) { return partes.map(function (s) { return f(s, modo); }).join(sep); }).join(br);
    };

    /* campo a campo */
    const marcadasTxt = marcadas.map(function (n) { return n + "(X) " + MODELO_ROTULO[n]; });
    const campos = [
      { rot: "Destinatário", html: f("{dest}", "html"), txt: f("{dest}", "txt"), copiar: true },
      { rot: "Objeto", html: marcadas.map(function (n) { return "<b>" + esc(n) + "(X)</b> " + esc(MODELO_ROTULO[n]); }).join("<br>"), txt: marcadasTxt.join("\n"), copiar: false },
      { rot: "Especificar", html: f(tpl.espec, "html"), txt: f(tpl.espec, "txt"), copiar: true },
      { rot: "Item 1", html: item1("html"), txt: item1("txt"), copiar: true },
      { rot: "Item 3", html: f(tpl.item3, "html"), txt: f(tpl.item3, "txt"), copiar: true },
      { rot: "Item 4", html: f(tpl.item4, "html"), txt: f(tpl.item4, "txt"), copiar: true },
      { rot: "Local e data", html: esc(tpl.local), txt: tpl.local, copiar: true },
      { rot: "Assinatura", html: f("{nome}", "html") + ' <span class="mudo">(no lugar de @nome_interessado@)</span>', txt: f("{nome}", "txt"), copiar: true }
    ];
    /* o botão de copiar fica dentro do dd: um div de dl só pode conter dt e dd */
    const formHtml = campos.map(function (c, i) {
      return "<div><dt>" + c.rot + '</dt><dd><span class="cc-txt">' + c.html + "</span>" +
        (c.copiar ? '<button type="button" class="btn-campo" data-copiar="campo" data-i="' + i + '" aria-label="Copiar ' + c.rot + '">' + ic("copiar") + "</button>" : "") + "</dd></div>";
    }).join("");

    /* documento completo: de REQUERIMENTO até a assinatura */
    const doc = function (modo) {
      if (modo === "txt") {
        return [
          "REQUERIMENTO", f("{dest}", "txt"), "", "OBJETO:", quadroObjeto(marcadas, "txt"), "",
          "Especificar: " + f(tpl.espec, "txt"), "",
          "1. " + item1("txt"), "",
          "2. " + tpl.item2, "",
          "3. " + f(tpl.item3, "txt"), "",
          "4. " + f(tpl.item4, "txt"), "",
          "Nestes termos,", "Pede deferimento.", "",
          tpl.local, "", "", f("{nome}", "txt")
        ].join("\n");
      }
      const limpo = modo === "limpo";
      const p = function (conteudo, cls, estilo) {
        return "<p" + (!limpo && cls ? ' class="' + cls + '"' : "") + (limpo && estilo ? ' style="' + estilo + '"' : "") + ">" + conteudo + "</p>";
      };
      return [
        p("<b>REQUERIMENTO</b>", "req-tit", "text-align:center"),
        p("<b>" + f("{dest}", modo) + "</b>", "req-dest"),
        p("<b>OBJETO:</b>", "req-obj"),
        quadroObjeto(marcadas, modo),
        p("<b>Especificar:</b> " + f(tpl.espec, modo), "req-esp"),
        p("<b>1.</b> " + item1(modo)),
        p("<b>2.</b> " + esc(tpl.item2)),
        p("<b>3.</b> " + f(tpl.item3, modo)),
        p("<b>4.</b> " + f(tpl.item4, modo)),
        p("Nestes termos,<br>Pede deferimento.", "req-fecho", "margin-left:40px"),
        p(esc(tpl.local)),
        p(f("{nome}", modo), "req-assin", "margin-left:100px;margin-top:36px")

  function montarGerador(g) {
    const raiz = $("#gerador");
    const m = g.minuta;
    const textos = { campos: [], doc: "", docHtml: "" };
    const ler = function (grupo) {
      const o = {};
      $$('[data-g="' + grupo + '"]', raiz).forEach(function (el) { o[el.getAttribute("data-c")] = el.value; });
      return o;
    };

    function atualizar(origem) {
      if (origem && origem.getAttribute && origem.getAttribute("data-g") === "d") store.set("dados", Object.assign({}, store.get("dados", {}), ler("d")));
      /* destinatário acompanha o assunto (ex.: LESP de oficial vai à DGP), até ser editado à mão */
      const destEl = $("#f-x-dest", raiz);
      if (destEl && origem === destEl) destEl.setAttribute("data-manual", "1");
      if (destEl && !destEl.getAttribute("data-manual")) {
        const auto = destinoDe(g, ler("p")).linha;
        if (destEl.value !== auto) destEl.value = auto;
      }
      const d = ler("d"), p = ler("p"), x = ler("x");
      const primeira = (x.vez || "1ª") === "1ª";
      const campoAnterior = $("#campo-anterior", raiz);
      if (campoAnterior) campoAnterior.hidden = primeira;
      if (primeira) x.anterior = "";

      const avisos = m.avisos ? m.avisos(p, U, d) : [];
      $("#avisos", raiz).innerHTML = avisos.map(function (a) {
        return '<p class="aviso aviso-' + a.tipo + '">' + ic(a.tipo === "info" ? "info" : (a.tipo === "erro" ? "erro" : "alerta")) + "<span>" + esc(a.txt) + "</span></p>";
      }).join("");

      const r = gerarTextos(g, d, p, x);
      const outForm = $("#out-form", raiz);
      if (outForm) outForm.innerHTML = r.formHtml;
      $("#out-texto", raiz).innerHTML = r.docPreview;
      textos.campos = r.campos; textos.doc = r.docTxt; textos.docHtml = r.docLimpo;

      const faltam = $$("#out-texto .ph", raiz).length;
      const et = $("#estado-txt", raiz);
      et.textContent = faltam ? (faltam === 1 ? "Falta 1 campo" : "Faltam " + faltam + " campos") : "Pronto para copiar";
      et.classList.toggle("ok", !faltam);
    }

    raiz.addEventListener("input", function (e) { atualizar(e.target); });
    raiz.addEventListener("change", function (e) { atualizar(e.target); });
    atualizarGeradorAtual = function () { atualizar(null); };
    raiz.addEventListener("click", function (e) {
      const b = e.target.closest ? e.target.closest("[data-copiar]") : null;
      if (!b) return;
      const faltam = $$("#out-texto .ph", raiz).length;
      const aviso = faltam ? " — ainda há campos entre colchetes" : "";
      if (b.getAttribute("data-copiar") === "doc") copiarRico(textos.docHtml, textos.doc, "Requerimento copiado" + aviso);
      else copiar(textos.campos[Number(b.getAttribute("data-i"))] || "", "Campo copiado");
    });
    atualizar(null);
  }

    app.innerHTML =

        '<div class="calcs">' +
          '<section class="calc" id="c1"><h2>Último dia de um afastamento</h2>' +
            '<div class="campos">' +
              campo({ id: "ini", rotulo: "Início", tipo: "data" }, "", "c1") +
              campo({ id: "qtd", rotulo: "Duração", tipo: "numero", min: 1, ex: "Ex.: 8" }, "", "c1") +
              campo({ id: "uni", rotulo: "Unidade", tipo: "lista", opcoes: ["dias corridos", "meses"] }, "dias corridos", "c1") +
            '</div><div class="atalhos"><span>Atalhos:</span>' +

              '<button type="button" data-c1="20|dias corridos">Paternidade (20 dias)</button>' +

            '</div><p class="calc-res" id="r1"></p></section>' +
          '<section class="calc" id="c2"><h2>Data-limite com antecedência</h2>' +
            '<div class="campos">' +
              campo({ id: "evt", rotulo: "Data do evento", tipo: "data" }, "", "c2") +
              campo({ id: "ant", rotulo: "Antecedência (dias corridos)", tipo: "numero", min: 1 }, "60", "c2") +
            '</div><div class="atalhos"><span>Atalhos:</span><button type="button" data-c2="60">Reprogramação de férias (60 dias)</button>' +
              '<button type="button" data-c2="30">Promoção requerida perto da compulsória (30 dias)</button></div>' +
            '<p class="calc-res" id="r2"></p></section>' +
          '<section class="calc" id="c3"><h2>Dias úteis antes de uma data</h2>' +
            '<div class="campos">' +
              campo({ id: "ref", rotulo: "Data de referência", tipo: "data" }, "", "c3") +
              campo({ id: "uteis", rotulo: "Dias úteis de antecedência", tipo: "numero", min: 1 }, "10", "c3") +
            "</div>" +
            '<p class="calc-res" id="r3"></p></section>' +
          '<section class="calc" id="c4"><h2>Tempo decorrido</h2>' +
            '<div class="campos">' +
              campo({ id: "de", rotulo: "Data inicial (ex.: ingresso)", tipo: "data" }, "", "c4") +
              campo({ id: "ate", rotulo: "Data final", tipo: "data" }, hoje, "c4") +
            '</div><p class="calc-res" id="r4"></p>' +
            '<p class="nota">Estimativa simples, sem descontos. A apuração oficial do tempo de serviço é a CTS.</p></section>' +
        "</div>" +
      "</div>";

    const val = function (g, c) { const el = $("#f-" + g + "-" + c); return el ? el.value : ""; };
    const definir = function (g, c, v) { const el = $("#f-" + g + "-" + c); if (el) el.value = v; };
    const res = function (id, html, tipo) { const el = $("#" + id); el.innerHTML = html; el.className = "calc-res" + (tipo ? " " + tipo : ""); };

    function c1() {
      const d = U.data(val("c1", "ini")), n = parseInt(val("c1", "qtd"), 10);
      if (!d || !(n > 0)) return res("r1", "Informe o início e a duração.", "vazio");
      const fim = val("c1", "uni") === "meses" ? U.soma(U.retornoMeses(d, n), -1) : U.soma(d, n - 1);
      res("r1", "Último dia: <strong>" + U.fmt(fim) + "</strong> (" + U.semana(fim) + "). Retorno em <strong>" + U.fmt(U.soma(fim, 1)) + "</strong> (" + U.semana(U.soma(fim, 1)) + ").");
    }
    function c2() {
      const d = U.data(val("c2", "evt")), n = parseInt(val("c2", "ant"), 10);
      if (!d || !(n > 0)) return res("r2", "Informe a data do evento e a antecedência.", "vazio");
      const lim = U.soma(d, -n), resta = U.dias(U.hoje(), lim);
      if (resta >= 0) res("r2", "Protocole até <strong>" + U.fmt(lim) + "</strong> (" + U.semana(lim) + "). " + (resta === 0 ? "O prazo termina hoje." : "Faltam " + resta + (resta === 1 ? " dia." : " dias.")), resta <= 5 ? "alerta" : "");
      else res("r2", "A data-limite era <strong>" + U.fmt(lim) + "</strong>: o prazo venceu há " + (-resta) + (resta === -1 ? " dia." : " dias."), "erro");
    }
    function c3() {
      const d = U.data(val("c3", "ref")), n = parseInt(val("c3", "uteis"), 10);
      if (!d || !(n > 0)) return res("r3", "Informe a data de referência e a quantidade de dias úteis.", "vazio");
      const lim = U.uteisAntes(d, n);
      res("r3", "Data-limite: <strong>" + U.fmt(lim) + "</strong> (" + U.semana(lim) + "). Se houver feriado no intervalo, antecipe um dia útil para cada feriado.");
    }
    function c4() {
      const a = U.data(val("c4", "de")), b = U.data(val("c4", "ate"));
      if (!a || !b) return res("r4", "Informe as duas datas.", "vazio");
      if (b < a) return res("r4", "A data final é anterior à inicial.", "erro");
      const t = U.intervalo(a, b);
      const prox = U.somaMeses(a, (Math.floor(t.anos / 10) + 1) * 120);
      res("r4", "<strong>" + t.anos + (t.anos === 1 ? " ano" : " anos") + ", " + t.meses + (t.meses === 1 ? " mês" : " meses") + " e " + t.dias + (t.dias === 1 ? " dia" : " dias") + "</strong> (" + U.dias(a, b) + " dias corridos). Próximo decênio completo em " + U.fmt(prox) + ".");
    }
    const calcs = { c1: c1, c2: c2, c3: c3, c4: c4 };
    Object.keys(calcs).forEach(function (k) {
      const sec = $("#" + k);
      sec.addEventListener("input", calcs[k]);
      sec.addEventListener("change", calcs[k]);
      calcs[k]();
    });
    $$("[data-c1]").forEach(function (b) { b.addEventListener("click", function () { const p = b.getAttribute("data-c1").split("|"); definir("c1", "qtd", p[0]); definir("c1", "uni", p[1]); c1(); }); });
    $$("[data-c2]").forEach(function (b) { b.addEventListener("click", function () { definir("c2", "ant", b.getAttribute("data-c2")); c2(); }); });
    $$("[data-c3]").forEach(function (b) { b.addEventListener("click", function () { definir("c3", "uteis", b.getAttribute("data-c3")); c3(); }); });
  }

    const PEND_DOC = PENDENCIAS.findIndex(function (p) { return /documento comprobat/i.test(p); });
    function atualizar(e) {
      if (e && e.target && e.target.getAttribute && e.target.getAttribute("data-g") === "k") {
        store.set("chefe", { cnome: v("k", "cnome"), cposto: v("k", "cposto"), cfuncao: v("k", "cfuncao") });
      }
      /* informar o documento faltante marca a pendência correspondente */
      if (e && e.target && e.target.id === "f-h-faltante" && v("h", "faltante")) {
        const caixa = $('[data-pend="' + PEND_DOC + '"]', raiz);
        if (caixa && !caixa.checked) caixa.checked = true;
      }
      const tipo = ($("input[name=tipo]:checked", raiz) || {}).value;
      const assuntoSel = v("h", "assunto");
      $("#assunto-outro-box").hidden = assuntoSel !== "Outro assunto";
      $("#pend-box").hidden = tipo !== "dev";
      const mapa = {
        req: { valor: v("h", "req"), rotulo: "requerente" },
        assunto: { valor: assuntoSel === "Outro assunto" ? v("h", "outro") : assuntoSel, rotulo: "assunto" },

        cposto: { valor: v("k", "cposto"), rotulo: "posto ou graduação" },
        cfuncao: { valor: v("k", "cfuncao"), rotulo: "função" }
      };
      const data = (CONFIG.cidade || "[cidade]") + ", " + U.extenso(U.hoje()) + ".";

          let t = PENDENCIAS[i];
          if (i === PEND_DOC && v("h", "faltante")) t += ": " + v("h", "faltante");
          return t;
        });
        if (v("h", "outra")) itens.push(minusc(v("h", "outra").replace(/[.;]+$/, "")));
        const letras = "abcdefghijklmnop";
        const lista = itens.length ? itens.map(function (t, i) { return letras.charAt(i) + ") " + t + (i === itens.length - 1 ? "." : ";"); }).join("\n") : "[marque ao menos uma pendência]";
        pars = [
          { tpl: "Ao(À) requerente, {req}." },
          { tpl: "Assunto: devolução para saneamento — {assunto}." },
          { tpl: "1. Restituo o presente processo para que sejam adotadas as seguintes providências:\n" + lista.replace(/[{}]/g, "") },
          { tpl: "2. Sanadas as pendências, reenvie o processo a esta chefia para nova análise." },
          { tpl: data, cls: "data" },
          { tpl: "{cnome}\n{cposto} — {cfuncao}", cls: "assin" }
        ];
      } else {
        pars = [
          { tpl: "À " + CONFIG.seiPessoal + "." },
          { tpl: "Assunto: {assunto} — {req}." },
          { tpl: "1. Encaminho o presente processo, no qual {req} formula o requerimento em epígrafe." },
          { tpl: "2. Conferi a regularidade formal do pedido e a juntada da documentação exigida, motivo pelo qual me manifesto favoravelmente ao seu prosseguimento." },
          { tpl: data, cls: "data" },
          { tpl: "{cnome}\n{cposto} — {cfuncao}", cls: "assin" }
        ];
      }
      $("#out-desp").innerHTML = pars.map(function (p) {
        return "<p" + (p.cls ? ' class="' + p.cls + '"' : "") + ">" + preencher(p.tpl, mapa, true).replace(/\n/g, "<br>") + "</p>";
      }).join("");
      texto = pars.map(function (p) { return preencher(p.tpl, mapa, false); }).join("\n\n");
    }
    raiz.addEventListener("input", atualizar);
    raiz.addEventListener("change", atualizar);
    $("#copiar-desp").addEventListener("click", function () { copiar(texto, "Despacho copiado"); });
    atualizar();
  }

  /* ajuda com o SEI (conteúdo e telas em sei.js)                         */
  /* ------------------------------------------------------------------ */
  const TEM_SEI = typeof SEI_AJUDA !== "undefined";
  function ajudaSeiHTML(g) {
    if (!TEM_SEI || g.opcao === "—") return "";
    return '<section class="ajuda-sei no-print">' + ic("ajuda", "ajuda-sei-ic") +
      '<div class="ajuda-sei-txt"><strong>Precisa de ajuda com o SEI?</strong><span>Veja, tela por tela, como montar este processo: ' +
        (g.minuta ? "criar, incluir o requerimento e os anexos, assinar e enviar." : "criar, incluir o formulário assinado e os comprovantes e enviar.") + "</span></div>" +
      '<a class="btn btn-sei" href="#/sei/' + g.id + '">Passo a passo no SEI' + ic("seta") + "</a></section>";
  }
  /* opções marcadas e vizinhas no quadro OBJETO, para o desenho do editor */
  function opcoesSei(g) {
    if (!numerica(g.opcao)) return "";
    const t = function (n) { return n + (MODELO_ROTULO[n] ? " – " + MODELO_ROTULO[n] : ""); };
    if (g.opcaoJunto) return "nas opções " + t(g.opcao) + " e " + t(g.opcaoJunto);
    return "na opção " + t(g.opcao) + (g.opcaoAlt ? " ou na " + t(g.opcaoAlt) : "");
  }
  function quadroParaSei(g) {
    if (!g.minuta || g.minuta.proprio) return [];
    const marc = marcadasDe(g, {});
    const idx = [];
    marc.forEach(function (n) {
      const i = MODELO.findIndex(function (o) { return o[0] === n; });
      [i - 1, i, i + 1].forEach(function (k) { if (k >= 0 && k < MODELO.length && idx.indexOf(k) < 0) idx.push(k); });
    });
    return idx.sort(function (x, y) { return x - y; }).slice(0, 7).map(function (k) {
      return [MODELO[k][0], MODELO[k][1], marc.indexOf(MODELO[k][0]) >= 0];
    });
  }
  function passoSeiHTML(p, i, total) {
    return '<div class="sei-passo-topo"><span class="sei-fase">' + esc(p.fase) + '</span><span class="sei-cont">Passo ' + (i + 1) + " de " + total + "</span></div>" +
      '<div class="sei-prog" aria-hidden="true"><span style="width:' + Math.round(((i + 1) / total) * 100) + '%"></span></div>' +
      '<h2 class="sei-passo-tit"><span class="sei-passo-num">' + (i + 1) + "</span><span>" + esc(p.titulo) + "</span></h2>" +
      (p.intro ? '<p class="sei-intro">' + esc(p.intro) + "</p>" : "") +
      '<figure class="sei-fig">' + p.tela + "<figcaption>" + esc(p.legenda || "Tela ilustrativa do SEI: os nomes de botões e campos são os do sistema; a aparência pode variar conforme a versão.") + "</figcaption></figure>" +
      '<ol class="sei-acoes">' + p.acoes.map(function (t, k) { return '<li><span class="sei-bola">' + (k + 1) + "</span><span>" + t + "</span></li>"; }).join("") + "</ol>" +
      (p.extra || "") +
      (p.dica ? '<p class="sei-nota-box dica">' + ic("info") + "<span><strong>Dica:</strong> " + esc(p.dica) + "</span></p>" : "") +
      (p.atencao ? '<p class="sei-nota-box atencao">' + ic("alerta") + "<span><strong>Atenção:</strong> " + esc(p.atencao) + "</span></p>" : "") +
      (p.link ? '<p class="sei-link no-print"><a href="' + p.link.href + '" target="_blank" rel="noopener">' + esc(p.link.texto) + ic("seta") + "</a></p>" : "");
  }
  function renderSei(id) {
    const g = GUIA[id];
    if (!g || !TEM_SEI || g.opcao === "—") { navegar(g ? "guia/" + g.id : "", true); return; }
    document.title = "Ajuda com o SEI — " + g.titulo + " — " + CONFIG.sistema;
    const ctx = {
      destino: g.minuta && !g.minuta.proprio ? destinoDe(g, {}) : null,
      opcoesTexto: opcoesSei(g),
      opcoesQuadro: quadroParaSei(g),
      dados: store.get("dados", {})
    };
    const rot = SEI_AJUDA.roteiro(g, ctx);
    const TRILHAS = [["requerente", "Para quem faz o pedido"], ["chefia", "Para a chefia imediata"]];
    const est = { trilha: store.get("sei:trilha", "requerente") };
    if (!rot[est.trilha]) est.trilha = "requerente";
    const chavePasso = function () { return "sei:" + g.id + ":" + est.trilha; };
    est.passo = Math.max(0, Math.min(store.get(chavePasso(), 0), rot[est.trilha].length - 1));
    const feitos = store.get("sei:" + g.id + ":feitos", {});

    app.innerHTML =
      '<div class="pagina pagina-int sei-pag" style="--cor:' + CAT[g.categoria].cor + '">' +
        '<nav class="migalhas no-print" aria-label="Navegação"><a href="#/guia/' + g.id + '">' + ic("voltar") + "Voltar ao guia: " + esc(g.titulo) + "</a></nav>" +
        '<header class="pag-cab sei-cab"><p class="sei-sobre">' + ic(g.icone) + esc(g.titulo) + "</p>" +
          "<h1>Passo a passo no SEI</h1>" +
          "<p>Siga na ordem. Cada passo mostra a tela com pontos numerados: os números da tela são os mesmos da explicação.</p>" +
          (rot.aviso ? '<p class="sei-nota-box atencao sei-aviso-pag">' + ic("alerta") + "<span>" + esc(rot.aviso) + "</span></p>" : "") + "</header>" +
        '<div class="sei-trilhas no-print" role="tablist" aria-label="Escolha o roteiro">' + TRILHAS.map(function (t) {
          return '<button type="button" role="tab" data-trilha="' + t[0] + '">' + esc(t[1]) + "</button>";
        }).join("") + "</div>" +
        '<div class="sei-grade">' +
          '<aside class="sei-sumario no-print" id="sei-sumario" aria-label="Passos"></aside>' +
          '<div class="sei-principal">' +
            '<label class="sei-ir no-print"><span>Ir para o passo</span><select id="sei-ir"></select></label>' +
            '<section class="sei-passo" id="sei-passo" aria-live="polite"></section>' +
            '<div class="sei-rodape-passo no-print">' +
              '<label class="sei-feito"><input type="checkbox" id="sei-feito"><span>Já fiz este passo</span></label>' +
              '<div class="sei-nav"><button type="button" class="btn btn-sec" id="sei-ant">' + ic("voltar") + "Anterior</button>" +
              '<button type="button" class="btn btn-sei" id="sei-prox">Próximo' + ic("seta") + "</button></div>" +
            "</div>" +
            '<div class="sei-acoes-pag no-print"><button type="button" class="btn btn-fantasma" id="sei-imprimir">' + ic("imprimir") + "Imprimir este roteiro</button></div>" +
          "</div>" +
        "</div>" +
        '<div class="sei-impressao" id="sei-impressao"></div>' +
      "</div>";

    function desenhar(rolar) {
      const passos = rot[est.trilha], total = passos.length;
      const fk = function (i) { return est.trilha + ":" + i; };
      $$("[data-trilha]").forEach(function (b) {
        const on = b.getAttribute("data-trilha") === est.trilha;
        b.classList.toggle("ativo", on); b.setAttribute("aria-selected", String(on));
      });
      let fase = "";
      $("#sei-sumario").innerHTML = passos.map(function (p, i) {
        const cab = p.fase !== fase ? '<p class="sei-sum-fase">' + esc(p.fase) + "</p>" : "";
        fase = p.fase;
        return cab + '<button type="button" class="sei-sum-it' + (i === est.passo ? " atual" : "") + (feitos[fk(i)] ? " feito" : "") + '" data-ir="' + i + '"' + (i === est.passo ? ' aria-current="step"' : "") + ">" +
          '<span class="sei-sum-num">' + (feitos[fk(i)] ? ic("check") : i + 1) + "</span><span>" + esc(p.titulo) + "</span></button>";
      }).join("");
      $("#sei-ir").innerHTML = passos.map(function (p, i) {
        return '<option value="' + i + '"' + (i === est.passo ? " selected" : "") + ">" + (i + 1) + ". " + esc(p.titulo) + (feitos[fk(i)] ? " ✓" : "") + "</option>";
      }).join("");
      $("#sei-passo").innerHTML = passoSeiHTML(passos[est.passo], est.passo, total);
      $("#sei-feito").checked = !!feitos[fk(est.passo)];
      $("#sei-ant").disabled = est.passo === 0;
      const ultimo = est.passo === total - 1;
      $("#sei-prox").innerHTML = (ultimo ? "Voltar ao guia" : "Próximo") + ic("seta");
      $("#sei-impressao").innerHTML = '<p class="sei-imp-cab">' + esc(g.titulo) + " — " + esc(TRILHAS.filter(function (t) { return t[0] === est.trilha; })[0][1]) + "</p>" +
        passos.map(function (p, i) { return '<section class="sei-imp-passo">' + passoSeiHTML(p, i, total) + "</section>"; }).join("");
      store.set("sei:trilha", est.trilha);
      store.set(chavePasso(), est.passo);
      if (rolar) {
        const el = $("#sei-passo"), topo = el.getBoundingClientRect().top;
        if (topo < 70 || topo > window.innerHeight * 0.6) window.scrollTo(0, Math.max(0, topo + window.scrollY - 90));
      }
    }
    const ir = function (i) { est.passo = Math.max(0, Math.min(i, rot[est.trilha].length - 1)); desenhar(true); };
    $$("[data-trilha]").forEach(function (b) {
      b.addEventListener("click", function () {
        est.trilha = b.getAttribute("data-trilha");
        est.passo = Math.max(0, Math.min(store.get(chavePasso(), 0), rot[est.trilha].length - 1));
        desenhar(true);
      });
    });
    $("#sei-sumario").addEventListener("click", function (e) {
      const b = e.target.closest ? e.target.closest("[data-ir]") : null;
      if (b) ir(Number(b.getAttribute("data-ir")));
    });
    $("#sei-ir").addEventListener("change", function (e) { ir(Number(e.target.value)); });
    $("#sei-ant").addEventListener("click", function () { ir(est.passo - 1); });
    $("#sei-prox").addEventListener("click", function () {
      if (est.passo === rot[est.trilha].length - 1) { navegar("guia/" + g.id); return; }
      ir(est.passo + 1);
    });
    $("#sei-feito").addEventListener("change", function (e) {
      const k = est.trilha + ":" + est.passo;
      if (e.target.checked) feitos[k] = true; else delete feitos[k];
      store.set("sei:" + g.id + ":feitos", feitos);
      desenhar(false);
    });
    $("#sei-imprimir").addEventListener("click", function () { window.print(); });
    desenhar(false);
  }
  /* setas do teclado na página de ajuda */
  document.addEventListener("keydown", function (e) {
    if (!$("#sei-passo") || e.ctrlKey || e.metaKey || e.altKey) return;
    const alvo = e.target;
    if (alvo && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA" || alvo.tagName === "SELECT" || alvo.isContentEditable)) return;
    if (e.key === "ArrowRight") { const b = $("#sei-prox"); if (b && !/Voltar/.test(b.textContent)) b.click(); }
    if (e.key === "ArrowLeft") { const b = $("#sei-ant"); if (b && !b.disabled) b.click(); }
  });

  document.addEventListener("keydown", function (e) {
    const alvo = e.target;
    const digitando = alvo && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA" || alvo.tagName === "SELECT" || alvo.isContentEditable);
    if (e.key === "/" && !digitando && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      if ((destinoAtual || "") !== "") { navegar(""); setTimeout(function () { const q = $("#q"); if (q) q.focus(); }, 30); }
      else { const q = $("#q"); if (q) { q.focus(); q.select(); } }
    }
  });

  renderTopo();
  renderRodape();
  const aoMudarEndereco = function () { const d = lerHash(); if (d !== destinoAtual) rota(d); };
  window.addEventListener("hashchange", aoMudarEndereco);
  window.addEventListener("popstate", aoMudarEndereco);
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!a || a.target === "_blank") return;
    e.preventDefault();
    navegar(a.getAttribute("href").slice(2));
  });
  rota();
})();

</script>
</body>
</html>
