<style>
/* =========================================================================
   CENTRAL DE REQUERIMENTOS — 7º GB · identidade visual
   vermelho viatura + ouro do brasão + faixa refletiva
   ========================================================================= */
:root {
  --vermelho: #B11E23;
  --vermelho-esc: #7A1216;
  --vermelho-tinta: #FBECEC;
  --ouro: #F2C12E;
  --ouro-esc: #8A6A00;
  --azul: #2F3A8F;
  --azul-tinta: #EDEFFA;
  --grafite: #23201F;
  --texto-2: #46423F;
  --mudo: #6B6762;
  --fundo: #FFFFFF;
  --fundo-2: #F3F4F6;
  --linha: #E2E4E9;
  --linha-2: #CBCFD6;
  --ok: #1D7A4D;
  --ok-tinta: #E6F4EC;
  --alerta: #7A5200;
  --alerta-tinta: #FFF5D9;
  --erro: #A3181D;
  --erro-tinta: #FDECEC;
  --fonte: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --fonte-c: "Barlow Condensed", "Arial Narrow", "Barlow", system-ui, sans-serif;
  --fonte-doc: Georgia, "Times New Roman", serif;
  --larg: 1180px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 96px; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--grafite);
  font: 400 1rem/1.55 var(--fonte);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
a { color: var(--azul); }
h1, h2, h3 { font-family: var(--fonte-c); font-weight: 700; line-height: 1.1; margin: 0; letter-spacing: -0.005em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; border-radius: 4px; }
.ic { width: 1.25em; height: 1.25em; flex: none; }
[hidden] { display: none !important; }

/* ---------- topo ---------- */
.topo {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--linha);
}
.topo-in {
  max-width: var(--larg); margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
}
.marca { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--grafite); min-width: 0; }
.marca-brasoes { display: flex; align-items: center; gap: 6px; }
.marca-brasoes img { height: 46px; width: auto; display: block; }
.marca-txt { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.marca-txt strong { font-family: var(--fonte-c); font-size: 1.35rem; font-weight: 700; }
.marca-txt span { font-size: .8rem; color: var(--mudo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu { display: flex; gap: 2px; flex-wrap: nowrap; }
.menu a {
  text-decoration: none; color: var(--texto-2); font-weight: 500; font-size: .93rem;
  padding: 8px 11px; border-radius: 8px; white-space: nowrap;
}
.menu a:hover { background: var(--fundo-2); color: var(--grafite); }
.menu a.ativo { color: var(--vermelho); background: var(--vermelho-tinta); }

/* ---------- hero ---------- */
.hero {
  background: linear-gradient(118deg, #B11E23 0%, #9C1A1F 52%, #74111A 100%);
  color: #fff; overflow: hidden;
}
.hero-in {
  max-width: var(--larg); margin: 0 auto; padding: 56px 20px 46px;
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 32px; align-items: center;
}
.hero-txt { position: relative; z-index: 1; max-width: 720px; }
.hero h1 { font-size: clamp(2.4rem, 5.4vw, 3.9rem); font-weight: 800; letter-spacing: -0.015em; line-height: 1; }
.hero-lead { margin-top: 14px; font-size: 1.12rem; color: rgba(255, 255, 255, .88); max-width: 60ch; }
.hero-brasao { width: 280px; height: auto; opacity: .13; justify-self: end; margin: -20px -10px -60px 0; pointer-events: none; user-select: none; }
.busca {
  margin-top: 26px; display: flex; align-items: center; gap: 12px;
  background: #fff; color: var(--grafite); border-radius: 12px; padding: 0 14px 0 18px; height: 62px;
  box-shadow: 0 14px 34px -14px rgba(30, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .04);
}
.busca .ic { color: var(--mudo); width: 1.4em; height: 1.4em; }
.busca input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 1.15rem; min-width: 0; height: 100%; }
.busca input::placeholder { color: #8C8781; }
.busca:focus-within { box-shadow: 0 14px 34px -14px rgba(30, 0, 0, .55), 0 0 0 3px var(--ouro); }
.busca kbd {
  font: 600 .8rem/1 var(--fonte); color: var(--mudo); border: 1px solid var(--linha-2); border-bottom-width: 2px;
  border-radius: 6px; padding: 5px 8px; background: var(--fundo-2);
}
.situacoes { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sit-rot { font-size: .92rem; color: rgba(255, 255, 255, .8); margin-right: 4px; }
.sit {
  background: rgba(255, 255, 255, .1); color: #fff; border: 1px solid rgba(255, 255, 255, .34);
  border-radius: 999px; padding: 6px 14px; font-size: .92rem; font-weight: 500; cursor: pointer;
}
.sit:hover { background: rgba(255, 255, 255, .2); }
.sit.ativa { background: #fff; color: var(--vermelho-esc); border-color: #fff; }

/* faixa refletiva — o único ornamento */
.faixa { height: 10px; background: repeating-linear-gradient(135deg, #fff 0 12px, var(--vermelho) 12px 24px); border-bottom: 1px solid #E7C9CA; }

/* ---------- estrutura ---------- */
.pagina { max-width: var(--larg); margin: 0 auto; padding: 28px 20px 64px; }
.pagina-int { padding-top: 36px; }
.pagina-estreita { max-width: 860px; }
.pag-cab { margin-bottom: 28px; max-width: 760px; }
.pag-cab h1 { font-size: clamp(2rem, 4vw, 2.7rem); }
.pag-cab p { margin-top: 10px; color: var(--texto-2); font-size: 1.05rem; }
.mudo { color: var(--mudo); }
.nota { font-size: .85rem; color: var(--mudo); margin-top: 10px; }

/* regras de ouro */
.regras { list-style: none; margin: 0 0 22px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--linha); border-radius: 12px; }
.regras li { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; }
.regras li + li { border-left: 1px solid var(--linha); }
.regras .ic { color: var(--vermelho); width: 1.6em; height: 1.6em; margin-top: 2px; }
.regras strong { display: block; font-size: .98rem; }
.regras span { display: block; font-size: .88rem; color: var(--mudo); }

.recentes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 24px; font-size: .9rem; }
.recentes > span { color: var(--mudo); }
.recentes a { text-decoration: none; color: var(--grafite); background: var(--fundo-2); padding: 5px 12px; border-radius: 999px; }
.recentes a:hover { background: var(--linha); }

/* ---------- índice ---------- */
.indice-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.indice-cab h2 { font-size: 1.9rem; }
.indice-cab p { color: var(--mudo); font-size: .92rem; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.filtros button {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  background: #fff; border: 1px solid var(--linha-2); border-radius: 999px; padding: 6px 13px; font-size: .92rem; font-weight: 500; color: var(--texto-2);
}
.filtros button i { width: 9px; height: 9px; border-radius: 2px; background: var(--cor); }
.filtros button span { color: var(--mudo); font-size: .82rem; }
.filtros button:hover { border-color: var(--grafite); }
.filtros button.ativo { background: var(--grafite); border-color: var(--grafite); color: #fff; }
.filtros button.ativo span { color: rgba(255, 255, 255, .7); }
.indice-info { min-height: 1.5em; margin: 10px 0 12px; color: var(--texto-2); font-size: .95rem; }
.link-btn { background: none; border: 0; padding: 0; color: var(--azul); text-decoration: underline; cursor: pointer; font-weight: 500; }

.grupos { columns: 2 460px; column-gap: 22px; }
.grupo-unico { columns: 1; }
.grupo { break-inside: avoid; margin: 0 0 22px; border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; background: #fff; display: inline-block; width: 100%; }
.grupo-tit {
  display: flex; align-items: center; gap: 10px; font-size: 1.18rem; padding: 13px 18px;
  border-bottom: 1px solid var(--linha); background: var(--fundo-2);
}
.grupo-tit i { width: 12px; height: 12px; border-radius: 3px; background: var(--cor); }
.grupo-tit span { margin-left: auto; font-family: var(--fonte); font-size: .82rem; font-weight: 500; color: var(--mudo); }
.grupo-itens .item { border-radius: 0; border: 0; border-bottom: 1px solid var(--linha); }
.grupo-itens .item:last-child { border-bottom: 0; }

.item {
  display: grid; grid-template-columns: 58px minmax(0, 1fr) 20px; gap: 14px; align-items: center;
  padding: 14px 18px; text-decoration: none; color: var(--grafite); background: #fff;
  border: 1px solid var(--linha); border-radius: 12px; position: relative;
}
.item:hover { background: #FBFBFC; }
.item:hover .item-seta { color: var(--cor); transform: translateX(2px); }
.item-op { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; border-right: 2px solid var(--cor); padding-right: 12px; min-height: 44px; }
.op-num { font-family: var(--fonte-c); font-weight: 700; font-size: 2rem; color: var(--cor); letter-spacing: -0.02em; }
.op-alt { font-size: .7rem; color: var(--mudo); margin-top: 3px; white-space: nowrap; }
.op-txt { font-size: .74rem; font-weight: 600; color: var(--cor); text-align: center; }
.item-corpo { display: flex; flex-direction: column; min-width: 0; }
.item-corpo strong { font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
.item-res { font-size: .88rem; color: var(--mudo); line-height: 1.4; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item-cat { font-size: .78rem; color: var(--cor); font-weight: 600; margin-top: 5px; }
.item-seta { color: var(--linha-2); transition: transform .15s, color .15s; }
.resultados { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }

.vazio { border: 1px dashed var(--linha-2); border-radius: 12px; padding: 28px; text-align: center; color: var(--texto-2); }
.vazio .ic { width: 2em; height: 2em; color: var(--linha-2); margin-bottom: 8px; }
.vazio p + p { margin-top: 6px; }
.vazio-op { list-style: none; display: inline-block; text-align: left; margin: 8px auto 10px; padding: 0; }
.vazio-op li { padding: 3px 0; }
.vazio-op b { font-variant-numeric: tabular-nums; }

/* ---------- guia ---------- */
.migalhas { margin-bottom: 18px; }
.migalhas a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--texto-2); font-weight: 500; font-size: .95rem; }
.migalhas a:hover { color: var(--vermelho); }
.guia-cab { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.guia-op {
  width: 104px; min-height: 104px; border: 2px solid var(--cor); border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; text-align: center;
}
.op-rot { font-size: .78rem; color: var(--mudo); font-weight: 500; }
.op-grande { font-family: var(--fonte-c); font-size: 3.4rem; font-weight: 800; line-height: .95; color: var(--cor); letter-spacing: -0.02em; }
.guia-op-txt { width: 170px; }
.op-desc { font-size: .82rem; font-weight: 600; color: var(--cor); line-height: 1.3; margin-top: 4px; }
.guia-cat { display: flex; align-items: center; gap: 7px; color: var(--cor); font-weight: 600; font-size: .92rem; }
.guia-tit h1 { font-size: clamp(2rem, 4.2vw, 2.9rem); margin-top: 4px; }
.guia-res { margin-top: 8px; font-size: 1.08rem; color: var(--texto-2); max-width: 68ch; }

.ficha {
  margin: 26px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  border-top: 3px solid var(--cor); background: var(--fundo-2); border-radius: 0 0 12px 12px;
}
.ficha > div { padding: 14px 18px; }
.ficha > div + div { border-left: 1px solid var(--linha); }
.ficha dt { font-size: .82rem; color: var(--mudo); font-weight: 600; }
.ficha dd { margin: 4px 0 0; font-size: .96rem; }

.guia-grade { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; margin-top: 28px; align-items: start; }
.guia-lateral { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 16px; }
.bloco { border: 1px solid var(--linha); border-radius: 12px; padding: 22px 24px; background: #fff; }
.bloco + .bloco { margin-top: 20px; }
.bloco h2 { font-size: 1.45rem; }
.bloco-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bloco-sub { color: var(--texto-2); margin-top: 6px; font-size: .95rem; }

.passos { list-style: none; margin: 18px 0 0; padding: 0; }
.passos li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 18px; }
.passos li:last-child { padding-bottom: 0; }
.passos li:not(:last-child)::before { content: ""; position: absolute; left: 16px; top: 34px; bottom: 2px; width: 2px; background: var(--linha); }
.passo-num {
  width: 34px; height: 34px; border-radius: 50%; background: var(--cor); color: #fff;
  display: grid; place-items: center; font-family: var(--fonte-c); font-weight: 700; font-size: 1.1rem;
}
.passo-txt strong { display: block; font-size: 1.03rem; line-height: 1.3; padding-top: 5px; }
.passo-txt p { color: var(--texto-2); margin-top: 3px; font-size: .96rem; }

.prog-txt, .estado-txt { font-size: .86rem; font-weight: 600; color: var(--mudo); }
.prog-txt.ok, .estado-txt.ok { color: var(--ok); }
.prog { height: 6px; border-radius: 6px; background: var(--fundo-2); margin: 12px 0 6px; overflow: hidden; }
.prog span { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s; }
.checklist { list-style: none; margin: 10px 0 0; padding: 0; }
.checklist li + li { border-top: 1px solid var(--linha); }
.checklist label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 11px 2px; cursor: pointer; align-items: start; }
.checklist input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.caixa { width: 22px; height: 22px; border: 2px solid var(--linha-2); border-radius: 6px; display: grid; place-items: center; color: transparent; margin-top: 1px; background: #fff; }
.caixa .ic { width: 15px; height: 15px; stroke-width: 3; }
.checklist input:checked + .caixa { background: var(--ok); border-color: var(--ok); color: #fff; }
.checklist input:checked + .caixa + span { color: var(--mudo); text-decoration: line-through; text-decoration-color: rgba(0, 0, 0, .25); }
.checklist input:focus-visible + .caixa { outline: 3px solid var(--ouro); outline-offset: 2px; }
.checklist.compacta label { padding: 7px 2px; font-size: .93rem; }
.pendencias input:checked + .caixa { background: var(--vermelho); border-color: var(--vermelho); }
.pendencias input:checked + .caixa + span { color: var(--grafite); text-decoration: none; font-weight: 500; }
.ome { margin-top: 12px; font-size: .9rem; color: var(--texto-2); background: var(--fundo-2); border-radius: 8px; padding: 10px 12px; }

.bloco-aviso { display: flex; gap: 12px; align-items: flex-start; background: var(--azul-tinta); border-color: #D5DAF3; }
.bloco-aviso .ic { color: var(--azul); margin-top: 2px; }

/* gerador */
.gerador { border-color: var(--linha-2); }
.grupo-campos { border: 0; padding: 0; margin: 20px 0 0; min-width: 0; }
.grupo-campos legend { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: .95rem; padding: 0; margin-bottom: 10px; color: var(--grafite); }
.grupo-campos legend .ic { color: var(--vermelho); }
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 14px; }
.campos + .campos { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--linha); }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo.largo { grid-column: 1 / -1; }
.campo > span { font-size: .84rem; font-weight: 600; color: var(--texto-2); }
.campo em { font-style: normal; font-weight: 400; color: var(--mudo); }
.campo input, .campo select, .campo textarea {
  width: 100%; border: 1px solid var(--linha-2); border-radius: 8px; padding: 9px 11px; background: #fff; min-height: 42px;
}
.campo textarea { resize: vertical; min-height: 76px; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: 0; border-color: var(--grafite); box-shadow: 0 0 0 3px rgba(242, 193, 46, .55); }
#campo-anterior { display: contents; }
#campo-anterior[hidden] { display: none !important; }

.avisos { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.avisos:empty { display: none; }
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; font-size: .93rem; }
.aviso .ic { margin-top: 2px; }
.aviso-info { background: var(--azul-tinta); color: #1E2766; }
.aviso-alerta { background: var(--alerta-tinta); color: var(--alerta); }
.aviso-erro { background: var(--erro-tinta); color: var(--erro); }

.saidas { display: grid; gap: 16px; margin-top: 20px; }
.saida { border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; background: var(--fundo-2); }
.saida header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--linha); }
.saida h3 { font-size: 1.08rem; }
.saida-form { margin: 0; padding: 6px 16px; background: #fff; display: grid; }
.saida-form > div { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; align-items: start; padding: 9px 0; }
.saida-form > div + div { border-top: 1px solid var(--linha); }
.saida-form dt { font-size: .84rem; font-weight: 600; color: var(--mudo); padding-top: 3px; }
.saida-form dd { margin: 0; font-size: .95rem; display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 12px; align-items: start; }
.saida-form .cc-txt { overflow-wrap: anywhere; }
.btn-campo {
  width: 34px; height: 30px; display: grid; place-items: center; cursor: pointer;
  border: 1px solid var(--linha-2); border-radius: 7px; background: #fff; color: var(--texto-2);
}
.btn-campo:hover { border-color: var(--grafite); color: var(--grafite); }
.btn-campo .ic { width: 1.05em; height: 1.05em; }
.papel {
  background: #fff; margin: 14px; padding: 26px 30px; border: 1px solid var(--linha);
  box-shadow: 0 1px 0 var(--linha), 0 8px 18px -14px rgba(0, 0, 0, .3);
  font: 1rem/1.75 var(--fonte-doc); color: #1d1d1d;
}
.papel p + p { margin-top: .9em; }
.papel .dest { font-weight: 700; }
.papel .assunto { font-style: italic; }
.papel .data { margin-top: 1.4em; text-align: right; }
.papel .assin { margin-top: 2em; text-align: center; line-height: 1.5; }
/* requerimento no formato do modelo do SEI */
.papel.req { font: .93rem/1.5 Calibri, Carlito, "Segoe UI", Arial, sans-serif; color: #111; }
.papel.req p + p { margin-top: .75em; }
.req-tit { text-align: center; letter-spacing: .02em; }
.req-obj { margin-top: 1em !important; }
.req-quadro { width: 100%; border-collapse: collapse; border: 3px double #555; margin-top: 4px; font-size: .84rem; line-height: 1.5; }
.req-quadro td { width: 50%; vertical-align: top; border: 1px solid #555; padding: 6px 8px; }
.req-quadro .marcada { background: #FFE8A3; font-weight: 700; border-radius: 3px; padding: 0 3px; margin: 0 -3px; }
.req-esp { margin-top: 1em !important; }
.req-fecho { padding-left: 2.4em; }
.req-assin { padding-left: 6em; margin-top: 2.2em !important; }
.req-sub { text-align: center; margin-top: 1em !important; }
.req-linhas { padding-left: 1.2em; }
.req-despacho { border: 1px solid #555; padding: 8px 12px; margin-top: 1.6em !important; }
.req-tabela { width: 100%; border-collapse: collapse; margin: .75em 0; font-size: .86rem; line-height: 1.4; }
.req-tabela th, .req-tabela td { border: 1px solid #555; padding: 4px 6px; vertical-align: top; text-align: left; }
.req-tabela th { background: #F1F2F4; font-weight: 700; }
.req-tabela .req-tab-n { width: 2.2em; text-align: center; }
.req-tabela .req-tab-sei-c { width: 24%; }
.req-tab-sei { color: #5F6670; font-style: italic; font-size: .82rem; }
.v { background: rgba(47, 58, 143, .07); border-radius: 3px; box-shadow: 0 1px 0 rgba(47, 58, 143, .25); }

/* quadros de consulta e formulários para baixar */
.tabela-guia tbody th { text-align: left; font-weight: 600; font-size: .9rem; color: var(--grafite); padding: 10px 12px; border-bottom: 1px solid var(--linha); vertical-align: top; width: 34%; }
.tabela-guia thead th:first-child:empty { border-bottom-color: var(--linha-2); }
.tag-confirmar { display: inline-block; font-size: .72rem; font-weight: 600; line-height: 1.5; padding: 0 7px; border-radius: 999px; background: var(--alerta-tinta); color: var(--alerta); border: 1px solid #F1DFA6; white-space: nowrap; vertical-align: 1px; }
.ficha-dest { display: block; margin-top: 4px; font-size: .86rem; color: var(--texto-2); }
.tabela-decide { min-width: 820px; }
.tabela-decide td { font-size: .9rem; }
.tabela-decide td:first-child { width: 26%; }
.td-op { display: block; margin-top: 2px; font-size: .78rem; color: var(--mudo); }
.formularios { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.form-baixar {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
  border: 1px solid var(--linha-2); border-radius: 10px; background: #fff; padding: 11px 14px; color: var(--grafite);
}
.form-baixar:hover { border-color: var(--grafite); background: var(--fundo-2); }
.form-baixar:focus-visible { outline: 0; box-shadow: 0 0 0 3px rgba(242, 193, 46, .55); border-color: var(--grafite); }
.form-ic { color: var(--azul); width: 1.5em; height: 1.5em; flex: none; }
.form-txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.form-txt strong { font-weight: 600; font-size: .95rem; }
.form-txt small { font-size: .8rem; color: var(--mudo); overflow-wrap: anywhere; }
.form-seta { color: var(--mudo); flex: none; }
mark.ph { background: #FFF0BF; color: #6B4A00; border-radius: 3px; padding: 0 3px; font-family: var(--fonte); font-size: .9em; }

/* laterais */
.caixa-atencao, .caixa-base, .relacionados { border-radius: 12px; padding: 16px 18px; }
.caixa-atencao { background: var(--alerta-tinta); border: 1px solid #F1DFA6; }
.caixa-atencao h2, .caixa-base h2, .relacionados h2 { display: flex; align-items: center; gap: 8px; font-size: 1.15rem; }
.caixa-atencao h2 .ic { color: var(--alerta); }
.caixa-atencao ul, .caixa-base ul { margin: 10px 0 0; padding-left: 18px; font-size: .92rem; }
.caixa-atencao li + li, .caixa-base li + li { margin-top: 6px; }
.caixa-base { border: 1px solid var(--linha); }
.caixa-base h2 .ic { color: var(--azul); }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.relacionados { border: 1px solid var(--linha); display: flex; flex-direction: column; gap: 4px; }
.relacionados h2 { margin-bottom: 6px; }
.relacionados a { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; text-decoration: none; color: var(--grafite); font-size: .93rem; line-height: 1.3; }
.relacionados a .ic { color: var(--cor); }
.relacionados a:hover { background: var(--fundo-2); }

/* botões */
.btn {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border-radius: 8px;
  font-weight: 600; font-size: .92rem; padding: 9px 14px; border: 1px solid transparent; text-decoration: none;
}
.btn-sec { background: #fff; border-color: var(--linha-2); color: var(--grafite); }
.btn-sec:hover { border-color: var(--grafite); }
.btn-mini { background: var(--grafite); color: #fff; padding: 6px 11px; font-size: .85rem; }
.btn-mini:hover { background: #000; }
.btn-fantasma { background: transparent; color: var(--texto-2); padding: 8px 10px; }
.btn-fantasma:hover { background: var(--fundo-2); }
.btn-fantasma.armado { background: var(--erro-tinta); color: var(--erro); }

/* ---------- tramitação ---------- */
.fluxo { list-style: none; margin: 0 0 30px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: etapa; }
.etapa { position: relative; border: 1px solid var(--linha); border-radius: 12px; padding: 18px 18px 16px; background: #fff; display: flex; gap: 14px; }
.etapa-num {
  flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--vermelho); color: #fff;
  display: grid; place-items: center; font-family: var(--fonte-c); font-weight: 700; font-size: 1.35rem;
}
.etapa-quem { font-size: .85rem; color: var(--vermelho); font-weight: 600; }
.etapa h2 { font-size: 1.3rem; margin-top: 2px; }
.etapa ul { margin: 8px 0 0; padding-left: 18px; font-size: .92rem; color: var(--texto-2); }
.etapa li + li { margin-top: 4px; }
.etapa-erro { display: flex; gap: 8px; margin-top: 10px; font-size: .86rem; color: var(--alerta); background: var(--alerta-tinta); padding: 8px 10px; border-radius: 8px; }
.etapa-erro .ic { margin-top: 1px; }

.tabela-rolagem { overflow-x: auto; margin-top: 14px; }
.tabela { width: 100%; border-collapse: collapse; font-size: .93rem; }
.tabela th { text-align: left; font-size: .82rem; color: var(--mudo); font-weight: 600; padding: 8px 12px; border-bottom: 2px solid var(--linha-2); }
.tabela td { padding: 10px 12px; border-bottom: 1px solid var(--linha); vertical-align: top; }
.tabela tbody tr:hover { background: #FAFAFB; }
.tabela a { color: var(--grafite); font-weight: 600; text-decoration: none; }
.tabela a:hover { color: var(--vermelho); text-decoration: underline; }

.filtro-linha { display: flex; align-items: center; gap: 10px; border: 1px solid var(--linha-2); border-radius: 10px; padding: 0 14px; height: 48px; max-width: 520px; }
.filtro-linha .ic { color: var(--mudo); }
.filtro-linha input { border: 0; outline: 0; flex: 1; height: 100%; background: transparent; }
.filtro-linha:focus-within { border-color: var(--grafite); box-shadow: 0 0 0 3px rgba(242, 193, 46, .55); }

/* ---------- prazos ---------- */
.calcs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.calc { border: 1px solid var(--linha); border-radius: 12px; padding: 20px 22px; }
.calc h2 { font-size: 1.35rem; margin-bottom: 14px; }
.atalhos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: .86rem; }
.atalhos span { color: var(--mudo); }
.atalhos button { border: 1px solid var(--linha-2); background: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: .84rem; }
.atalhos button:hover { border-color: var(--grafite); }
.calc-res { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: var(--ok-tinta); color: #12502F; font-size: .97rem; }
.calc-res.vazio { background: var(--fundo-2); color: var(--mudo); }
.calc-res.alerta { background: var(--alerta-tinta); color: var(--alerta); }
.calc-res.erro { background: var(--erro-tinta); color: var(--erro); }

/* ---------- chefia ---------- */
.chefia-grade { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.chefia-grade .bloco + .bloco { margin-top: 0; }
#triagem .btn { margin-top: 10px; }
.segmento { display: inline-flex; border: 1px solid var(--linha-2); border-radius: 10px; padding: 3px; margin: 14px 0 6px; background: var(--fundo-2); flex-wrap: wrap; }
.segmento input { position: absolute; opacity: 0; }
.segmento span { display: block; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .92rem; color: var(--texto-2); }
.segmento input:checked + span { background: #fff; color: var(--grafite); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.segmento input:focus-visible + span { outline: 3px solid var(--ouro); }
#despacho .campos { margin-top: 12px; }
#despacho .saida { margin-top: 20px; }
#assunto-outro-box { display: contents; }

/* ---------- dúvidas e siglas ---------- */
.duvidas details { border-bottom: 1px solid var(--linha); }
.duvidas summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 2px; font-weight: 600; font-size: 1.04rem; }
.duvidas summary::-webkit-details-marker { display: none; }
.duvidas summary .ic { color: var(--mudo); transition: transform .15s; }
.duvidas details[open] summary .ic { transform: rotate(90deg); color: var(--vermelho); }
.duvidas details p { padding: 0 2px 18px; color: var(--texto-2); max-width: 70ch; }
.glossario { margin: 18px 0 0; }
.glossario > div { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--linha); }
.glossario dt { font-family: var(--fonte-c); font-weight: 700; font-size: 1.15rem; color: var(--vermelho); }
.glossario dd { margin: 0; color: var(--texto-2); }

/* ---------- rodapé ---------- */
.rodape { border-top: 1px solid var(--linha); background: var(--fundo-2); }
.rodape-in { max-width: var(--larg); margin: 0 auto; padding: 26px 20px 30px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 24px; align-items: center; }
.rodape-id { display: flex; align-items: center; gap: 8px; }
.rodape-id img { height: 48px; width: auto; }
.rodape-id div { display: flex; flex-direction: column; margin-left: 6px; line-height: 1.3; font-size: .86rem; color: var(--mudo); }
.rodape-id strong { color: var(--grafite); font-size: .95rem; }
.rodape-nota { font-size: .84rem; color: var(--mudo); max-width: 64ch; }

/* ---------- aviso flutuante ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--grafite); color: #fff; padding: 11px 18px; border-radius: 10px; font-weight: 500; font-size: .95rem;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5); transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100% - 32px);
}
.toast.visivel { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsivo ---------- */
@media (max-width: 1080px) {
  .topo-in { flex-wrap: wrap; padding-bottom: 0; }
  .menu { width: 100%; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; margin: 0 -6px; -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
  .menu::-webkit-scrollbar { display: none; }
  /* minmax(0, 1fr): conteúdo largo (tabelas) rola dentro da própria caixa, nunca alarga a página */
  .guia-grade { grid-template-columns: minmax(0, 1fr); }
  .guia-lateral { position: static; }
  .fluxo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .hero-in { grid-template-columns: 1fr; padding: 40px 20px 36px; }
  .hero-brasao { position: absolute; right: -40px; bottom: -50px; width: 220px; margin: 0; opacity: .1; }
  .regras { grid-template-columns: 1fr; }
  .regras li + li { border-left: 0; border-top: 1px solid var(--linha); }
  .calcs, .chefia-grade { grid-template-columns: 1fr; }
  .rodape-in { grid-template-columns: 1fr; }
  .resultados { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .topo { position: static; }
  .marca-txt span { display: none; }
  .marca-brasoes img { height: 38px; }
  .marca-txt strong { font-size: 1.15rem; }
  .busca { height: 56px; }
  .busca kbd { display: none; }
  .busca input { font-size: 1.05rem; }
  .sit-rot { width: 100%; }
  .pagina { padding: 22px 16px 48px; }
  .hero-in, .topo-in, .rodape-in { padding-left: 16px; padding-right: 16px; }
  .guia-cab { grid-template-columns: 1fr; gap: 14px; }
  .guia-op { width: auto; min-height: 0; flex-direction: row; justify-content: flex-start; gap: 10px; padding: 8px 14px; align-self: start; }
  .op-grande { font-size: 2.3rem; }
  .guia-op-txt { width: auto; flex-direction: column; align-items: flex-start; }
  .ficha > div + div { border-left: 0; border-top: 1px solid var(--linha); }
  .bloco { padding: 18px 16px; }
  .papel { margin: 10px; padding: 18px 16px; font-size: .95rem; }
  .saida-form > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .saida-form dd { gap: 10px; }
  .req-quadro { font-size: .74rem; }
  .req-quadro td { padding: 4px 5px; }
  .req-tabela { font-size: .76rem; }
  .req-tabela th, .req-tabela td { padding: 3px 4px; overflow-wrap: anywhere; }
  .req-tabela .req-tab-sei-c { overflow-wrap: normal; }
  .req-tab-sei { font-size: .7rem; }
  .req-assin { padding-left: 2em; }
  .fluxo { grid-template-columns: 1fr; }
  .item { grid-template-columns: 50px minmax(0, 1fr) 16px; padding: 12px 14px; gap: 12px; }
  .op-num { font-size: 1.7rem; }
  .glossario > div { grid-template-columns: 1fr; gap: 2px; }
  .resultados { grid-template-columns: 1fr; }
  /* tabelas dos guias (ex.: calibres) cabem na tela do celular */
  .tabela-guia thead th, .tabela-guia tbody th, .tabela-guia td { padding: 8px 6px; }
  .tabela-guia tbody th, .tabela-guia td { font-size: .86rem; }
  .tabela-guia tbody th { width: auto; }
}
@media (max-width: 400px) {
  .tabela-guia thead th, .tabela-guia tbody th, .tabela-guia td { padding: 7px 4px; }
  .tabela-guia tbody th, .tabela-guia td { font-size: .8rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- impressão (ficha do guia) ---------- */
@media print {
  @page { margin: 14mm 14mm 16mm; }
  body { background: #fff; font-size: 11pt; }
  .topo { position: static; border-bottom: 2px solid var(--vermelho); backdrop-filter: none; }
  .topo-in, .rodape-in { max-width: none; padding-left: 0; padding-right: 0; }
  .menu, .no-print, .hero, .faixa, .toast, .rodape .btn, .grupo-campos, .avisos, .btn-mini, .bloco-sub, .estado-txt, .prog { display: none !important; }
  .pagina { padding: 12px 0 0; max-width: none; }
  .guia-grade { display: block; margin-top: 16px; }
  .guia-lateral { position: static; margin-top: 14px; }
  .bloco, .caixa-atencao, .caixa-base, .saida, .etapa { break-inside: avoid; box-shadow: none; }
  .papel { box-shadow: none; margin: 8px; }
  .checklist input:checked + .caixa { background: #fff; color: var(--grafite); border-color: var(--grafite); }
  .checklist input:checked + .caixa + span { text-decoration: none; color: var(--grafite); }
  .ficha { background: #fff; border: 1px solid var(--linha); }
  a { color: inherit; text-decoration: none; }
  .rodape { background: #fff; }
}

.sei-passo { border: 1px solid var(--linha); border-radius: 12px; background: #fff; padding: 20px 22px; }

.sei-fase { text-transform: uppercase; letter-spacing: .05em; color: #1F4E85; }

.sei-passo-tit { display: flex; align-items: center; gap: 12px; font-size: 1.6rem; line-height: 1.15; }

.sei-intro { margin-top: 8px; color: var(--texto-2); font-size: 1.02rem; }

.sei-link .ic { width: 1em; height: 1em; }
.sei-anexos { margin-top: 16px; border: 1px solid var(--linha); border-radius: 10px; padding: 12px 14px; background: #FAFBFC; }

/* -------------------------------------------------------------------------
   Telas ilustrativas (aparência do SEI)
   ------------------------------------------------------------------------- */
.sei-tela {

}

.sei-ic { width: 16px; height: 16px; flex: none; }
.sei-corpo { display: flex; min-height: 220px; }

.sei-conteudo { flex: 1; min-width: 0; padding: 14px 16px; }
.sei-tit { font-weight: 700; color: var(--sei-esc); font-size: 14px; border-bottom: 2px solid #DCE3EB; padding-bottom: 4px; margin-bottom: 10px; }

/* destaque e números */
.sei-alvo { position: relative; outline: 3px solid #F2C12E; outline-offset: 2px; border-radius: 4px; box-shadow: 0 0 0 7px rgba(242, 193, 46, .22); animation: seiPulso 1.6s ease-in-out infinite; }
.sei-tela [data-n]::after {
  content: attr(data-n); position: absolute; top: -12px; right: -12px; z-index: 3;
  width: 22px; height: 22px; border-radius: 50%; background: #B11E23; color: #fff; text-align: center;
  font: 700 12px/22px var(--fonte); box-shadow: 0 0 0 2px #fff; outline: 0;
}
.sei-tela .n-esq[data-n]::after { right: auto; left: -12px; }
@keyframes seiPulso { 0%, 100% { box-shadow: 0 0 0 7px rgba(242, 193, 46, .22); } 50% { box-shadow: 0 0 0 11px rgba(242, 193, 46, .08); } }
@media (prefers-reduced-motion: reduce) { .sei-alvo { animation: none; } }

/* formulários */
.sei-form { display: flex; flex-direction: column; gap: 9px; }

.sei-rot { font-weight: 700; font-size: 12px; color: #333; }

.sei-input.sei-vazio { color: #999; }
.sei-select { position: relative; padding-right: 22px; }

.sei-radios { display: flex; flex-wrap: wrap; gap: 6px 14px; }

.sei-hip { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; }

.sei-dupla { grid-template-columns: 168px minmax(0, 120px) auto minmax(0, 1fr); }
.sei-botoes { display: flex; gap: 8px; justify-content: flex-end; padding-top: 4px; }
.sei-botao { display: inline-block; border: 1px solid #8FA2B8; border-radius: 3px; background: linear-gradient(#FDFDFD, #E1E7EE); padding: 3px 12px; font-weight: 700; font-size: 12px; color: var(--sei-esc); white-space: nowrap; }
.sei-botao.pri { background: linear-gradient(#FFFFFF, #D7E3F2); }
.sei-arq-nome { margin-left: 8px; font-size: 12px; color: #444; }
.sei-sugestao { display: block; margin-top: 2px; border: 1px solid #A9B4C2; border-top: 0; background: #F4F8FD; padding: 3px 7px; font-size: 12px; color: var(--sei-esc); }

/* escolha de tipo */
.sei-escolha { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

/* controle de processos */
.sei-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.sei-assinado { color: #1D7A4D; display: inline-flex; margin-left: auto; }

.sei-proc-dir { flex: 1; min-width: 0; padding: 10px 12px; }
.sei-barra { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid #EEF1F5; margin-bottom: 10px; }
.sei-icone { position: relative; width: 30px; height: 30px; border: 1px solid #D5DDE7; border-radius: 4px; display: grid; place-items: center; color: var(--sei); background: #fff; }
.sei-dica { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #333; color: #fff; font-size: 11px; padding: 3px 7px; border-radius: 3px; white-space: nowrap; z-index: 4; }
.sei-proc-info { font-size: 12px; color: #666; padding-top: 6px; }
.sei-tabela { display: grid; grid-template-columns: auto auto 1fr; gap: 0; font-size: 12px; border: 1px solid #DCE3EB; }

.sei-tabela .cab { background: #EEF1F5; font-weight: 700; }

/* janelas sobrepostas (editor, assinatura) */
.sei-palco { background: linear-gradient(rgba(23, 54, 95, .30), rgba(23, 54, 95, .30)), repeating-linear-gradient(0deg, #F4F6F9 0 18px, #EDF1F5 18px 19px); padding: 18px 14px 22px; }
.sei-janela { position: relative; width: min(100%, 580px); margin: 0 auto; background: #fff; border: 1px solid #8FA2B8; border-radius: 6px; box-shadow: 0 16px 30px -12px rgba(0, 0, 0, .5); }

.sei-janela .sei-form { padding: 12px; }
.sei-ed-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid #DCE3EB; background: #F6F8FB; }
.sei-ed-fmt { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #DCE3EB; border-radius: 3px; background: #fff; font-size: 12px; color: #444; }
.sei-ed-folha { padding: 12px 18px 16px; font: 12px/1.45 Calibri, Carlito, Arial, sans-serif; display: flex; flex-direction: column; gap: 8px; }

.sei-ed-cab { text-align: center; font-size: 10.5px; color: #555; }
.sei-ed-tit { text-align: center; }
.sei-ed-quadro { display: grid; grid-template-columns: 1fr; border: 2px double #777; padding: 4px 8px; font-size: 11.5px; }
.sei-ed-quadro .x { background: #FFE8A3; font-weight: 700; }
.sei-ed-assin { align-self: center; text-align: center; }
.sei-ed-fixo { color: #8A8F98; }

/* fora do SEI: arquivos, gov.br e Central */
.sei-arquivos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.sei-arq { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 6px; text-align: center; font-size: 12px; overflow-wrap: anywhere; }
.sei-pdf { width: 46px; height: 56px; border-radius: 4px; background: #fff; border: 1px solid #C9CFD8; display: grid; place-items: end center; padding-bottom: 6px; font: 700 11px Arial, sans-serif; color: #fff; background: linear-gradient(#fff 55%, #C62828 55%); }
.sei-govbr { max-width: 460px; margin: 0 auto; }
.sei-gov-tit { font-weight: 700; font-size: 15px; color: #1351B4; margin-bottom: 12px; }
.sei-gov-passos { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }

/* quadro de documentos do requerimento de modelo próprio, no editor */
.sei-ed-tab { display: grid; grid-template-columns: 26px minmax(0, 1fr) 76px; border: 1px solid #9AA3AF; margin-top: 8px; font-size: 10.5px; }
.sei-ed-tab span { padding: 3px 5px; border-right: 1px solid #C9CFD8; border-bottom: 1px solid #C9CFD8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sei-central { display: flex; flex-direction: column; gap: 8px; font-family: var(--fonte); }
.sei-cc-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.sei-cc > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sei-cc > span.sei-alvo:nth-child(2) { overflow: visible; min-width: 0; }
.sei-trunc { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sei-copia { display: grid; place-items: center; width: 26px; height: 24px; border: 1px solid #CBCFD6; border-radius: 6px; color: #46423F; }
.sei-print img { display: block; width: 100%; height: auto; border: 1px solid #C5CED9; border-radius: 8px; }

/* celular */
@media (max-width: 900px) {
  .sei-grade { grid-template-columns: minmax(0, 1fr); }
  .sei-sumario { display: none; }
  .sei-ir { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-weight: 600; font-size: .9rem; color: var(--texto-2); }
  .sei-ir select { border: 1px solid var(--linha-2); border-radius: 8px; padding: 9px 10px; background: #fff; font: 500 .95rem var(--fonte); }
}
@media (max-width: 640px) {
  .ajuda-sei { flex-direction: column; align-items: flex-start; }
  .ajuda-sei .btn { width: 100%; justify-content: center; }
  .sei-passo { padding: 16px 14px; }
  .sei-passo-tit { font-size: 1.3rem; }
  .sei-passo-num { width: 34px; height: 34px; font-size: 1.1rem; }
  .sei-nav { width: 100%; }
  .sei-nav .btn { flex: 1; justify-content: center; }
  .sei-menu { display: none; }
  .sei-tela-menu .sei-menu { display: flex; width: 100%; border-right: 0; }
  .sei-tela-menu .sei-conteudo { display: none; }
  .sei-pesq span { display: none; }
  .sei-pesq { min-width: 0; }
  .sei-linha, .sei-dupla { grid-template-columns: minmax(0, 1fr); }
  .sei-conteudo { padding: 14px 12px; }
  .sei-proc { flex-direction: column; margin: -14px -12px; }
  .sei-arvore { width: auto; border-right: 0; border-bottom: 1px solid #DCE3EB; }
  .sei-colunas { grid-template-columns: minmax(0, 1fr); }
  .sei-palco { padding: 14px 8px 16px; }
  .sei-cc { grid-template-columns: 74px minmax(0, 1fr) 26px; }
  .sei-dica { left: 0; transform: none; }
  .sei-arquivos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}

/* impressão: todos os passos da trilha escolhida */
@media print {
  .sei-grade, .sei-trilhas { display: none !important; }
  .sei-impressao { display: block; }
  .sei-imp-cab { font-weight: 700; margin-bottom: 8px; }
  .sei-imp-passo { break-inside: avoid; border-top: 1px solid #999; padding: 10px 0 14px; }
  .sei-alvo { animation: none; }
  .sei-tela { box-shadow: none; }
}

</style>
</head>

/* Aviso de término para afastamentos de duração fixa */
function avisoTermino(campo, dias) {
  return function (v, u) {
    const d = u.data(v[campo]);
    if (!d) return [];
    const fim = u.soma(d, dias - 1);
    return [{ tipo: "info", txt: "Último dia do afastamento: " + u.fmt(fim) + " (" + u.semana(fim) + "). Retorno em " + u.fmt(u.soma(fim, 1)) + "." }];
  };
}

<script>
/* Ajuda com o SEI (sei.js) e prints reais opcionais (src/sei_prints) */
const SEI_PRINTS = {};
/* =========================================================================
   AJUDA COM O SEI — passo a passo ilustrado, montado a partir de cada guia
   -------------------------------------------------------------------------
   • As telas são DESENHADAS aqui (ilustrativas), com os nomes de botões e
     campos do SEI. A aparência pode variar conforme a versão do SEI-PE.
   • Para trocar um desenho por um print real: salve a imagem em
     src/sei_prints/<nome-da-tela>.png (ou .jpg) e rode o build.py.
     Nomes das telas: arquivos, govbr, central, inicio, tipo-processo,
     dados-processo, processo, tipo-documento, gerar-documento, editor,
     assinatura, externo, arvore, enviar, andamento, recebidos, atribuir,
     despacho.
   • Para retirar a ajuda: apague este arquivo e o sei.css e recompile.
   ========================================================================= */
const SEI_CONFIG = {
  endereco: "sei.pe.gov.br",
  unidade: "SUA UNIDADE",                    // sigla mostrada no alto das telas
  numero: "3900000000.000000/2026-00",       // número de processo de exemplo
  assinador: "assinador.iti.br"              // assinador gov.br (ITI)
};

const SEI_AJUDA = (function () {
  "use strict";
  const PRINTS = typeof SEI_PRINTS !== "undefined" ? SEI_PRINTS : {};
  const esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  /* ponto numerado e destaque */
  const N = function (n) { return n ? ' data-n="' + n + '"' : ""; };
  const A = function (n) { return n ? " sei-alvo" : ""; };
  const b = function (t) { return "<b>" + esc(t) + "</b>"; };
  /* nome de arquivo: permite quebrar a linha depois de cada "_" */
  const arqHTML = function (t) { return esc(t).replace(/_/g, "_<wbr>"); };

  /* ícones da barra do SEI (desenho próprio, só para orientar) */
  const IC = {
    docmais: '<path d="M5 2.5h6l4 4v11H5z"/><path d="M11 2.5v4h4"/><path d="M10 9v6M7 12h6"/>',
    enviar: '<path d="M3 10h11"/><path d="m10 6 4 4-4 4"/><path d="M16.5 4v12"/>',
    atribuir: '<circle cx="8" cy="7" r="3"/><path d="M3 17c0-3 2.2-5 5-5s5 2 5 5"/><path d="M14 8h4m-2-2 2 2-2 2"/>',
    caneta: '<path d="m4 16 1-4 8-8 3 3-8 8z"/><path d="m11 6 3 3"/>',
    lupa: '<circle cx="9" cy="9" r="5"/><path d="m13 13 4 4"/>',
    olho: '<path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z"/><circle cx="10" cy="10" r="2"/>',
    relogio: '<circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/>',
    nota: '<path d="M4 3h12v10l-4 4H4z"/><path d="M12 17v-4h4"/>',
    check: '<path d="m4 10 4 4 8-8"/>',
    estrela: '<path d="m10 3 2.1 4.3 4.7.7-3.4 3.3.8 4.7L10 13.8 5.8 16l.8-4.7L3.2 8l4.7-.7z"/>',
    lapis: '<path d="M4 16v-3l9-9 3 3-9 9z"/>',
    lixo: '<path d="M5 6h10M8 6V4h4v2M6 6l1 11h6l1-11"/>',
    bloco: '<rect x="3" y="6" width="10" height="11"/><path d="M6 6V3h11v11h-4"/>',
    pasta: '<path d="M2 5h6l2 2h8v9H2z"/>',
    doc: '<path d="M5 2.5h6l4 4v11H5z"/><path d="M11 2.5v4h4"/>',
    elo: '<path d="m8 12 4-4M7 8H5.5a3 3 0 0 0 0 6H7m6-6h1.5a3 3 0 0 1 0 6H13"/>'
  };
  const ic = function (nome) {
    return '<svg class="sei-ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (IC[nome] || IC.doc) + "</svg>";
  };

  /* ---------------------------------------------------------------------
     Moldura das telas
     o.chave ......... nome da tela (para troca por print real)
     o.url ........... endereço mostrado na barra do navegador
     o.semSei ........ true: não desenha o topo nem o menu do SEI
     o.menu .......... true: mostra o menu lateral
     o.menuAlvo/menuN  item do menu destacado
     o.unidadeN ...... destaca a unidade no alto
     o.buscaN ........ destaca a pesquisa no alto
     o.popup ......... HTML de uma janela por cima (editor, assinatura)
     --------------------------------------------------------------------- */
  const MENU = ["Controle de Processos", "Iniciar Processo", "Retorno Programado", "Pesquisa", "Base de Conhecimento",
    "Textos Padrão", "Modelos Favoritos", "Blocos de Assinatura", "Contatos", "Acompanhamento Especial", "Marcadores", "Estatísticas"];

  function moldura(o, corpo) {
    if (PRINTS[o.chave]) {
      return '<div class="sei-print"><img src="' + PRINTS[o.chave] + '" alt="Tela do SEI: ' + esc(o.alt || o.chave) + '"></div>';
    }
    const menu = o.menu ? '<nav class="sei-menu' + (o.soMenu ? " sei-menu-cel" : "") + '">' + MENU.map(function (m) {
      const alvo = m === o.menuAlvo;
      return '<span class="sei-menu-it' + A(alvo ? o.menuN : 0) + '"' + N(alvo ? o.menuN : 0) + ">" + esc(m) + "</span>";
    }).join("") + "</nav>" : "";
    const topo = o.semSei ? "" :
      '<div class="sei-topo"><span class="sei-logo">sei<b>!</b></span>' +
        '<span class="sei-pesq' + A(o.buscaN) + '"' + N(o.buscaN) + ">" + ic("lupa") + "<span>Pesquisar…</span></span>" +
        '<span class="sei-unid' + A(o.unidadeN) + '"' + N(o.unidadeN) + ">" + esc(SEI_CONFIG.unidade) + " ▾</span>" +
      "</div>";
    return '<div class="sei-tela' + (o.soMenu ? " sei-tela-menu" : "") + '" aria-hidden="true">' +
      '<div class="sei-navegador"><span class="sei-bolinhas"><i></i><i></i><i></i></span><span class="sei-url">' + esc(o.url || SEI_CONFIG.endereco) + "</span></div>" +
      topo +
      (o.popup
        ? '<div class="sei-palco"><div class="sei-janela">' + o.popup + "</div></div>"
        : '<div class="sei-corpo">' + menu + '<div class="sei-conteudo">' + corpo + "</div></div>") +
    "</div>";
  }

  /* peças de formulário */
  function linha(rotulo, controle, n) {
    return '<div class="sei-linha' + A(n) + '"' + N(n) + '><span class="sei-rot">' + esc(rotulo) + "</span>" + controle + "</div>";
  }
  const caixa = function (t, vazio) { return '<span class="sei-input' + (vazio ? " sei-vazio" : "") + '">' + (t ? esc(t) : "&nbsp;") + "</span>"; };
  const lista = function (t) { return '<span class="sei-input sei-select">' + esc(t) + "</span>"; };
  const radios = function (ops, marcado) {
    return '<span class="sei-radios">' + ops.map(function (op) {
      return '<span class="sei-radio' + (op === marcado ? " on" : "") + '"><i></i>' + esc(op) + "</span>";
    }).join("") + "</span>";
  };
  const marca = function (t, on, n) { return '<span class="sei-check' + (on ? " on" : "") + A(n) + '"' + N(n) + "><i></i>" + esc(t) + "</span>"; };
  const botao = function (t, n, pri) { return '<span class="sei-botao' + (pri ? " pri" : "") + A(n) + '"' + N(n) + ">" + esc(t) + "</span>"; };
  const titulo = function (t) { return '<div class="sei-tit">' + esc(t) + "</div>"; };
  const junto = function () { return '<span class="sei-campo">' + Array.prototype.join.call(arguments, "") + "</span>"; };

  /* ---------------------------------------------------------------------
     Telas
     --------------------------------------------------------------------- */
  function telaArquivos(anexos) {
    const itens = (anexos.length ? anexos : [{ arquivo: "RG_Militar.pdf" }]).slice(0, 8);
    return moldura({ chave: "arquivos", semSei: true, url: "Meus arquivos › Pedido no SEI" },
      '<div class="sei-arquivos">' + itens.map(function (x, i) {
        return '<span class="sei-arq' + A(i === 0 ? 1 : 0) + '"' + N(i === 0 ? 1 : 0) + '><span class="sei-pdf">PDF</span><span>' + arqHTML(x.arquivo) + "</span></span>";
      }).join("") + "</div>");
  }

  /* assinador.iti.br: Escolher arquivo › Avançar › posicionar › Assinar › código no app › Autorizar › Baixar */
  function telaGovbr() {
    return moldura({ chave: "govbr", semSei: true, url: SEI_CONFIG.assinador },
      '<div class="sei-govbr">' +
        '<div class="sei-gov-tit">Assinatura eletrônica gov.br</div>' +
        '<div class="sei-gov-passos">' +
          '<div class="sei-gov-linha">' + botao("Escolher arquivo", 1) + botao("Avançar", 2, true) + "</div>" +
          '<div class="sei-gov-folha"><span class="sei-gov-txt"></span><span class="sei-gov-txt"></span><span class="sei-gov-txt curto"></span>' +
            '<span class="sei-gov-ass sei-alvo" data-n="3">Assinatura</span></div>' +
          botao("Assinar", 4, true) +
          '<div class="sei-gov-linha"><span class="sei-input sei-gov-cod">Código do app gov.br</span>' + botao("Autorizar", 5, true) + "</div>" +
          botao("Baixar", 6) +

  /* ---------------------------------------------------------------------
     Dados do guia usados no roteiro
     --------------------------------------------------------------------- */
  const PREFIXOS = /^(Depois da compra|Depois da promoção|Ao final|Para vistoria|Munição|Acessório|Aluno-aprendiz|Na adoção|No caso[^:]*):\s*/;
  function nomeArvore(t) {
    let s = t.replace(PREFIXOS, "").replace(/\s*\([^)]*\)/g, "");
    s = s.split(/,\s/)[0];
    const ou = s.split(/ ou /);
    if (ou.length > 1 && !/\s/.test(ou[0].trim())) {
      /* "Ata ou laudo de inspeção da JMS" → "Ata de inspeção da JMS" */
      const resto = ou[1].trim().split(/\s+/).slice(1).join(" ");
      s = ou[0].trim() + (resto ? " " + resto : "");
    } else s = ou[0];
    s = s.replace(/\s+—\s+/g, " – ").replace(/–\s*requerimento de /i, "– ");
    s = s.replace(/\s+(emitid|expedid)[ao]s?\s.*$/i, "").replace(/\s+comprovando\s.*$/i, "").replace(/\s+(preenchid|assinad)[ao]s?(\s.*)?$/i, "");
    s = s.replace(/^C[óo]pia (leg[íi]vel )?(integral )?(do|da|dos|das|de) /i, "").trim();
    s = s.charAt(0).toUpperCase() + s.slice(1);
    if (s.length > 46) s = s.slice(0, 46).replace(/\s+\S*$/, "");
    /* não termina em preposição ou artigo solto */
    let antes;
    do { antes = s; s = s.replace(/[\s–—→,;:]+$/, "").replace(/\s+(a|o|as|os|e|de|da|do|das|dos|em|na|no|para|pela|pelo|com|cada)$/i, ""); } while (s !== antes);
    return s;
  }
  function arquivo(nome) {
    let s = nome.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
    if (s.length > 40) s = s.slice(0, 40).replace(/_[^_]*$/, "").replace(/(_(e|a|o|de|da|do|das|dos|em|na|no|com|para))+$/i, "");
    return s + ".pdf";
  }
  /* itens que não entram no SEI: munição se compra na loja; vistoria é presencial */
  const FORA_DO_SEI = /^(Munição|Para vistoria)$/;
  function anexosDe(g) {
    const proprio = !!(g.minuta && g.minuta.proprio);
    return (g.docs || []).map(function (d, i) {
      if (/^Requerimento \(modelo do SEI\)/.test(d)) return null;
      /* requerimento de modelo próprio (Anexo I, Anexo C…): é escrito e assinado no editor do SEI, não é anexo */
      if (proprio && /^Requerimento\b/.test(d) && /\bAnexo [A-Z]\b/.test(d)) return null;
      const m = d.match(PREFIXOS);
      /* nome na árvore: o do guia, se houver; senão, tirado do texto do documento */
      const nome = (g.arvore && g.arvore[i]) || nomeArvore(d);
      return { texto: d, nome: nome, arquivo: arquivo(nome), quando: m ? m[1] : "", sensivel: /acesso restrito|laudo|atestado|\bCID\b/i.test(d) };
    }).filter(function (x) { return x && !FORA_DO_SEI.test(x.quando); });
  }
  function palavraChave(g) {
    if (/^arma-|^craf$/.test(g.id)) return "arma";
    if (g.id === "reserva") return "reserva";
    if (g.id === "dependentes-sadrh") return "dependentes";
    const p = (g.titulo.split(/[\s:(-]+/)[0] || "requerimento").toLowerCase();
    return p.length > 2 ? p : "requerimento";
  }

  /* lista de anexos do guia, para os passos */
  function tabelaAnexos(anexos, restritoGeral) {
    if (!anexos.length) return "";
    return '<div class="sei-anexos"><div class="sei-anexos-tit">Documentos deste pedido</div><ul>' + anexos.map(function (x) {
      return "<li><span class=\"sei-anexo-nome\">" + esc(x.texto) + "</span>" +
        '<span class="sei-anexo-dica">Nome na árvore: <b>' + esc(x.nome) + "</b>" +
        (x.sensivel ? ' · Nível de acesso: <b>Restrito</b>' : (restritoGeral ? " · Nível de acesso: <b>Restrito</b>" : "")) +
        (x.quando ? " · <em>" + esc(x.quando.toLowerCase()) + "</em>" : "") + "</span></li>";
    }).join("") + "</ul></div>";
  }

  /* ---------------------------------------------------------------------
     Roteiro: passos para quem pede e para a chefia
     ctx: { destino, opcoesTexto, opcoesQuadro: [[n, rótulo, marcada]], dados }
     --------------------------------------------------------------------- */
  function roteiro(g, ctx) {
    ctx = ctx || {};
    const dados = ctx.dados || {};
    const quem = ((dados.posto || "") + " " + (dados.nome || "")).trim();
    const ASSUNTO = { "arma-sinarm-sigma": "Transferência de arma de civil para militar", "arma-municao": "Aquisição de acessório de arma particular" };
    const assunto = ASSUNTO[g.id] || g.titulo.replace(/\s*\(.*\)$/, "").replace(/\s+—\s+/g, ": ");
    const especificacao = assunto + " – " + (quem || "seu posto/graduação e nome");
    const interessado = (dados.nome || "SEU NOME COMPLETO").toUpperCase();
    const anexos = anexosDe(g);
    const sensivel = anexos.some(function (x) { return x.sensivel; });
    /* observações ("depois da compra", "na adoção"...) só valem se houver também itens sem observação */
    const obs = !anexos.some(function (x) { return !x.quando; }) ? [] :
      anexos.map(function (x) { return x.quando.toLowerCase(); }).filter(function (o, i, l) { return o && l.indexOf(o) === i; });
    const fora = (g.docs || []).map(function (d) { const m = d.match(PREFIXOS); return m && FORA_DO_SEI.test(m[1]) ? { quando: m[1], texto: d.replace(PREFIXOS, "") } : null; }).filter(Boolean);
    const aviso = fora.some(function (x) { return x.quando === "Munição"; })
      ? "Munição não passa pelo SEI: compra-se direto na loja, com o CRAF válido e a identidade funcional. Este passo a passo vale para o pedido de acessório (Anexo C)."
      : "";
    const vistoria = fora.filter(function (x) { return x.quando === "Para vistoria"; }).map(function (x) { return x.texto; });
    const SEM_ASSINATURA = ["form-01", "form-02"];
    /* formulários do pedido que levam assinatura digital; os de depois (ex.: Anexos D, E e F da promoção) ficam de fora */
    const idsForm = (g.formularios || []).filter(function (id) { return FORMULARIOS[id] && !FORMULARIOS[id].depois && SEM_ASSINATURA.indexOf(id) < 0; });
    const forms = idsForm.map(function (id) { return FORMULARIOS[id]; });
    const nomesForms = (idsForm.indexOf("anexo-c-permitido") >= 0 && idsForm.indexOf("anexo-c-restrito") >= 0
      ? ["Anexo C (o de uso permitido ou o de uso restrito, conforme a arma)"].concat(idsForm.filter(function (id) { return !/^anexo-c-/.test(id); }).map(function (id) { return FORMULARIOS[id].titulo; }))
      : forms.map(function (f) { return f.titulo; }));
    const duasPartes = idsForm.some(function (id) { return /^anexo-[ijk]$/.test(id); });
    const formsDepois = anexos.filter(function (x) {
      return x.quando && obs.length && forms.some(function (f) { return x.texto.toLowerCase().indexOf(f.titulo.split(" — ")[0].toLowerCase()) >= 0; });
    }).map(function (x) { return x.quando.toLowerCase(); }).filter(function (o, i, l) { return l.indexOf(o) === i; });
    const temReq = !!(g.minuta && !g.minuta.proprio);
    const proprio = !!(g.minuta && g.minuta.proprio);
    const pr = proprio ? g.minuta.proprio : null;
    /* quando o requerimento cita o nº SEI de cada anexo (Anexo C), os anexos entram antes dele */
    const anexosAntes = !!(pr && pr.anexosAntes);
    const docsAnexos = anexos.filter(function (x) { return !x.quando; }).slice(0, 5).map(function (x) { return { nome: x.nome }; });
    const docReq = (temReq || proprio) ? [{ nome: "Requerimento", assinado: true }] : [];
    const docsArvore = anexosAntes ? docsAnexos.concat(docReq) : docReq.concat(docsAnexos);
    const nivelTexto = sensivel
      ? "marque " + b("Restrito") + " e, em Hipótese Legal, escolha " + b("Informação Pessoal") + " — este pedido tem documento com dado de saúde."
      : "siga a orientação da Seção de Pessoal. Se houver dado pessoal sensível, marque " + b("Restrito") + " com a hipótese " + b("Informação Pessoal") + ".";

    const req = [];
    const F1 = "Antes de abrir o SEI", F2 = "No SEI: montar o processo", F3 = "No SEI: enviar e acompanhar";

    req.push({
      fase: F1, titulo: "Separe os documentos em PDF",
      intro: "O SEI recebe cada documento como um arquivo. Deixe tudo pronto antes de começar: fica mais rápido e você não perde o que já fez.",
      tela: telaArquivos(anexos), legenda: "Ilustração: um arquivo PDF para cada documento.",
      acoes: [
        "Digitalize cada documento em " + b("PDF") + " — um arquivo por documento, legível e na posição certa. O celular resolve: use um aplicativo de digitalização.",
        "Dê ao arquivo um nome que diga o que ele é (ex.: <b>" + arqHTML(anexos.length ? anexos[0].arquivo : "RG_Militar.pdf") + "</b>).",
        "Confira a lista abaixo: são os documentos deste pedido."
      ],
      extra: tabelaAnexos(anexos, false),
      dica: obs.length
        ? "Itens marcados com " + obs.map(function (o) { return "“" + o + "”"; }).join(" ou ") + " só entram no processo na situação indicada."
        : "Arquivo muito pesado pode ser recusado pelo SEI. Se acontecer, digitalize de novo em tons de cinza ou com resolução menor.",
      atencao: vistoria.length ? "A vistoria é presencial: " + vistoria.join("; ") + " vão com você e não entram no SEI." : ""
    });

    if (forms.length) {
      req.push({
        fase: F1, titulo: "Preencha e assine os formulários no gov.br",
        intro: "Estes formulários levam a sua assinatura digital (gov.br ou ICP-Brasil): " + nomesForms.join("; ") + ".",
        tela: telaGovbr(), legenda: "Tela ilustrativa do assinador gov.br: a aparência pode variar.",
        acoes: [
          "Baixe o formulário no guia, preencha no Word e salve em PDF (Arquivo › Salvar como › PDF). Depois, em " + b(SEI_CONFIG.assinador) + ", entre com a sua conta gov.br e clique em " + b("Escolher arquivo") + ".",
          "Clique em " + b("Avançar") + " para carregar o documento.",
          "Arraste a assinatura até o campo de assinatura do formulário.",
          "Clique em " + b("Assinar") + ". O código de autorização chega no aplicativo gov.br: abra o app e toque no sino, no alto da tela.",
          "Digite o código na página e clique em " + b("Autorizar") + ".",
          "Clique em " + b("Baixar") + ". É esse PDF assinado que vai para o SEI."
        ],
        dica: formsDepois.length
          ? "Assine agora só o que vai no pedido. O que está marcado com " + formsDepois.map(function (o) { return "“" + o + "”"; }).join(" ou ") + " na lista de documentos fica para a situação indicada."
          : "",
        atencao: "A conta gov.br precisa ser nível prata ou ouro para assinar." +
          (duasPartes ? " O requerimento de transferência é assinado pelas duas partes: a outra parte assina o mesmo PDF já assinado por você." : "")
      });
    }

    if (g.minuta) {
      req.push({
        fase: F1, titulo: "Monte o texto na Central",
        intro: "O gerador do guia deixa o requerimento pronto para copiar. Faça isso antes de abrir o SEI e deixe a página aberta.",
        tela: telaCentral(ctx.destino ? ctx.destino.linha : "", pr), legenda: "Tela da Central (gerador do guia).",
        acoes: proprio ? [
          "No guia, preencha " + b("Seus dados") + ((g.minuta.campos || []).length ? " e as " + b(String(pr.legenda || "Dados do pedido").toLowerCase()) : " e escolha a vez que requer") + ".",
          "Confira o texto pronto, no modelo do " + esc(pr.modelo || pr.titulo) + ".",
          "Clique em " + b("Copiar tudo") + " quando for colar no SEI."
        ] : [
          "Destinatário deste pedido: " + b(ctx.destino ? ctx.destino.linha : CONFIG.destinatario) + ".",
          "Preencha os campos do gerador: o texto de " + b("Especificar") + " sai pronto.",
          "Cada campo tem um botão de copiar ao lado: você vai colar um por um no SEI."
        ],
        link: { href: "#/guia/" + g.id, texto: "Abrir o guia em outra aba" }
      });
    }

    req.push({
      fase: F2, titulo: "Entre no SEI e confira a sua unidade",
      intro: "Use o seu usuário e a sua senha do SEI. O processo nasce na unidade que estiver selecionada no alto da tela.",
      tela: telaInicio({ unidadeN: 1 }),
      acoes: [
        "Acesse " + b(SEI_CONFIG.endereco) + ", entre com usuário e senha e confira, no alto da tela, se a unidade é a sua. Se tiver mais de uma, troque nessa lista."
      ],
      dica: "O navegador pode bloquear janelas do SEI (editor e assinatura). Se nada abrir ao clicar, permita pop-ups para " + SEI_CONFIG.endereco + "."
    });

    req.push({
      fase: F2, titulo: "Inicie o processo",
      intro: "Todo pedido começa com um processo novo.",
      tela: telaInicio({ menuAlvo: "Iniciar Processo", menuN: 1 }),
      acoes: ["No menu à esquerda, clique em " + b("Iniciar Processo") + ". Se o menu estiver escondido, clique no ícone de três traços (☰) para exibi-lo."]
    });

    req.push({
      fase: F2, titulo: "Escolha o tipo do processo",
      intro: "O tipo do processo organiza o pedido no SEI. Use o tipo que a Seção de Pessoal indicar para este assunto.",
      tela: telaTipoProcesso(palavraChave(g)),
      acoes: [
        "Digite uma palavra do assunto no filtro (ex.: " + b(palavraChave(g)) + " ou " + b("requerimento") + ").",
        "Clique no tipo indicado pela Seção de Pessoal.",
        "Não apareceu? Clique no " + b("+") + " ao lado de “Escolha o Tipo do Processo” para ver todos os tipos."
      ],
      atencao: "Na dúvida sobre o tipo, pergunte à Seção de Pessoal antes de criar: processo com tipo errado costuma voltar."
    });

    req.push({
      fase: F2, titulo: "Preencha os dados do processo",
      intro: "Só três campos pedem a sua atenção. Os outros o SEI preenche ou ficam em branco.",
      tela: telaDadosProcesso({ especificacao: especificacao, interessado: interessado, restrito: sensivel }),
      acoes: [
        "Especificação: um resumo curto do pedido. Sugestão: " + b(especificacao) + ".",
        "Interessados: digite o seu nome, espere a lista aparecer e escolha o seu nome.",
        "Nível de acesso: " + nivelTexto,
        "Clique em " + b("Salvar") + ". O SEI mostra o número do processo: anote."
      ]
    });

    /* anexos (documentos externos): depois do requerimento ou, se ele cita o nº SEI de cada um, antes */
    const exAnexo = anexos.filter(function (x) { return !x.quando; })[0] || anexos[0] || { nome: "RG Militar", arquivo: "RG_Militar.pdf" };
    const passoAnexos = {
      fase: F2, titulo: "Inclua os anexos (documentos externos)",
      intro: anexosAntes ? "Comece pelos documentos: eles entram como “Externo”, um de cada vez. O requerimento vem depois, porque o quadro dele traz o número SEI de cada documento."
        : (temReq || proprio ? "Os documentos que você digitalizou entram como “Externo”, um de cada vez."
          : "Neste pedido, o formulário assinado no gov.br é o próprio pedido: ele e os comprovantes entram como “Externo”, um de cada vez."),
      tela: telaExterno({ nome: exAnexo.nome, arquivo: exAnexo.arquivo, interessado: interessado, restrito: exAnexo.sensivel, tipo: /^Certid/.test(exAnexo.nome) ? "Certidão" : "" }),
      acoes: [
        "Clique em " + b("Incluir Documento") + " e escolha " + b("Externo") + " (primeiro da lista). Em Tipo do Documento, escolha o mais próximo (ex.: Documento, Certidão, Comprovante, Formulário).",
        "Informe a data do documento e o " + b("Nome na Árvore") + " (ex.: " + b(exAnexo.nome) + ").",
        "Formato: " + b("Nato-digital") + " se o arquivo já nasceu digital; " + b("Digitalizado nesta Unidade") + " se você escaneou um papel (o SEI pede o tipo de conferência e pode pedir a sua senha para autenticar).",
        "Nível de acesso: o mesmo do processo; documento com dado de saúde vai sempre como " + b("Restrito") + ".",
        "Em " + b("Anexar Arquivo") + ", escolha o PDF.",
        "Clique em " + b("Confirmar Dados") + ". Repita para cada documento da lista."
      ],
      extra: tabelaAnexos(anexos, false)
    };
    if (anexosAntes) req.push(passoAnexos);

    if (temReq || proprio) {
      req.push({
        fase: F2, titulo: "Clique em Incluir Documento",
        intro: anexosAntes ? "Com os documentos na árvore, falta o requerimento." : "Agora o processo existe, mas está vazio. O primeiro documento é o requerimento.",
        tela: telaProcesso({ docs: anexosAntes ? docsAnexos : [], selProc: true, alvo: "Incluir Documento", n: 1 }),
        acoes: ["Na barra de ícones, clique em " + b("Incluir Documento") + " (folha com sinal de mais). Passe o mouse sobre os ícones para ver o nome de cada um."]
      });
      req.push({
        fase: F2, titulo: "Escolha o documento Requerimento",
        intro: "O SEI lista os tipos de documento. Os documentos internos são escritos no próprio SEI.",
        tela: telaTipoDocumento("Requerimento"),
        acoes: [
          "Digite " + b("requerimento") + " no filtro.",
          "Clique em " + b("Requerimento") + (proprio ? " (ou no tipo indicado pela Seção de Pessoal)." : ".")
        ]
      });
      req.push({
        fase: F2, titulo: "Confirme os dados do documento",
        intro: proprio ? "O texto do pedido vai ser colado da Central." : "O modelo do requerimento do CBMPE já vem pronto no tipo Requerimento.",
        tela: telaGerarDocumento({ tipo: "Requerimento", interessado: interessado, restrito: sensivel }),
        acoes: [
          "Texto Inicial: deixe " + b("Nenhum") + ".",
          "Nível de acesso: o mesmo do processo.",
          "Clique em " + b("Confirmar Dados") + ". O editor abre em outra janela."
        ]
      });
      if (proprio) {
        req.push({
          fase: F2, titulo: anexosAntes ? "Cole o texto, preencha os números e salve" : "Cole o texto e salve",
          intro: "O requerimento deste assunto tem modelo próprio (" + (pr.modelo || pr.titulo) + ").",
          tela: telaEditor({ modo: "proprio", tituloTexto: tituloProprio(pr), trecho: pr.trechoSei, tabelaN: anexosAntes ? 2 : 0, salvarN: anexosAntes ? 3 : 2 }),
          acoes: [
            "Apague o conteúdo que vier no documento e cole o texto copiado na Central (" + b("Copiar tudo") + ")."
          ].concat(anexosAntes ? [
            "No quadro dos documentos, preencha a coluna " + b("Nº doc. SEI") + " com o número de cada documento: ele aparece entre parênteses ao lado do nome, na árvore. Nos itens “se houver” que não se aplicam a você, deixe em branco."
          ] : []).concat([
            "Clique em " + b("Salvar") + "."
          ])
        });
      } else {
        req.push({
          fase: F2, titulo: "Preencha o requerimento no editor",
          intro: "Cole os campos copiados da Central nos lugares indicados.",
          tela: telaEditor({ opcoes: ctx.opcoesQuadro, destino: ctx.destino ? ctx.destino.linha : "", salvarN: 6 }),
          acoes: [
            "Destinatário: deixe " + b(ctx.destino ? ctx.destino.linha : CONFIG.destinatario) + ". Se o modelo trouxer outro, troque a linha.",
            "OBJETO: coloque X " + (ctx.opcoesTexto ? esc(ctx.opcoesTexto) : "na opção do pedido") + ".",
            "Especificar: cole o campo " + b("Especificar") + " da Central.",
            "Itens 1, 3 e 4: cole os campos " + b("Item 1") + ", " + b("Item 3") + " e " + b("Item 4") + ". O item 2 já vem pronto no modelo.",
            "No fim: cole " + b("Local e data") + " e troque " + b("@nome_interessado@") + " pelo seu nome (campo " + b("Assinatura") + ").",
            "Clique em " + b("Salvar") + "."
          ],
          dica: "Se o SEI já preencher o seu nome, RG ou endereço sozinho, só confira."
        });
      }
      req.push({
        fase: F2, titulo: "Assine o requerimento",
        intro: "Sem assinatura, o requerimento não vale: a chefia devolve.",
        tela: telaAssinatura({ assinante: interessado }),
        acoes: [
          "No editor, clique em " + b("Assinar") + " (ou, na árvore, selecione o documento e clique em " + b("Assinar Documento") + "). Escolha o seu " + b("Cargo / Função") + ".",
          "Digite a sua senha do SEI.",
          "Clique em " + b("Assinar") + ". Na árvore, o documento passa a mostrar a caneta de assinado."
        ],
        atencao: "Se precisar corrigir depois de assinar, o SEI pede nova assinatura. Confira antes."
      });
    }

    if (!anexosAntes) req.push(passoAnexos);

    req.push({
      fase: F2, titulo: "Confira a árvore do processo",
      intro: "Antes de enviar, olhe a coluna da esquerda: é ali que a chefia vai conferir.",
      tela: telaProcesso({ docs: docsArvore.length ? docsArvore : [{ nome: "Documento" }], selProc: true, procN: 1, docN: 2, docAlvo: 0 }),
      acoes: [
        "O número do processo fica no topo. Embaixo, todos os documentos do pedido.",
        (temReq || proprio ? "O requerimento tem a caneta de assinado. " : "") + "Clique em cada documento para conferir se abre e se é o arquivo certo."
      ]
    });

    req.push({
      fase: F3, titulo: "Envie à sua chefia imediata",
      intro: "A chefia imediata confere o pedido antes da Seção de Pessoal. Não envie direto à Seção de Pessoal.",
      tela: telaEnviar({}),
      acoes: [
        "Clique no número do processo (topo da árvore) e no ícone " + b("Enviar Processo") + ". Em Unidades, digite a sigla da unidade SEI da sua chefia e escolha na lista.",
        "Quer que o processo continue na sua lista? Marque " + b("Manter processo aberto na unidade atual") + ". Se não marcar, você ainda acha pelo número.",
        "Clique em " + b("Enviar") + "."
      ],
      dica: "Não sabe a sigla da unidade da sua chefia? Pergunte a ela ou à Seção de Pessoal."
    });

    req.push({
      fase: F3, titulo: "Acompanhe até a publicação",
      intro: "Com o número do processo, você vê por onde ele passou e onde está agora.",
      tela: telaAndamento(docsArvore.length ? docsArvore : [{ nome: "Documento" }]),
      acoes: [
        "Para achar o processo, digite o número na " + b("pesquisa") + ", no alto da tela.",
        "Clique em " + b("Consultar Andamento") + " (abaixo da árvore) para ver o histórico."
      ],
      atencao: "Se a chefia devolver com pendências, corrija no mesmo processo (inclua o que faltou) e envie de novo para ela."
    });

    /* trilha da chefia imediata */
    const FC = "Chefia imediata";
    const chefia = [
      {
        fase: FC, titulo: "Abra o processo recebido",
        intro: "Os processos que chegam à sua unidade ficam na coluna Recebidos.",
        tela: telaRecebidos(),
        acoes: ["Em " + b("Controle de Processos") + ", coluna " + b("Recebidos") + ", clique no número. Número em vermelho é processo ainda não aberto."]
      },
      {
        fase: FC, titulo: "Atribua a quem vai conferir (se for o caso)",
        intro: "Atribuir não muda o processo de unidade: só indica quem, dentro da unidade, cuida dele.",
        tela: telaAtribuir(),
        acoes: [
          "Com o processo aberto, clique no ícone " + b("Atribuir Processo") + " e escolha o militar em " + b("Atribuir para") + ".",
          "Clique em " + b("Salvar") + ". O nome aparece ao lado do número, no Controle de Processos."
        ]
      },
      {
        fase: FC, titulo: "Confira a documentação",
        intro: "Use a lista de conferência da página Para a chefia e os documentos exigidos neste guia.",
        tela: telaProcesso({ chave: "arvore", docs: docsArvore.length ? docsArvore : [{ nome: "Documento" }], selProc: true, procN: 1, docN: 2, docAlvo: 0 }),
        acoes: [
          "Confira o número do processo e o requerente.",
          "Abra cada documento: " + (temReq || proprio ? "o requerimento assinado e os anexos da lista abaixo" : "o formulário assinado e os comprovantes da lista abaixo") + "."
        ],
        extra: tabelaAnexos(anexos, false),
        link: { href: "#/chefia", texto: "Abrir a lista de conferência (Para a chefia)" }
      },
      {
        fase: FC, titulo: "Inclua o despacho",
        intro: "O despacho registra a sua decisão: encaminhar ou devolver com pendências.",
        tela: telaEditor({ modo: "despacho", salvarN: 2, assinarN: 3 }),
        acoes: [
          "Clique em " + b("Incluir Documento") + ", escolha " + b("Despacho") + " e, no editor, cole o texto gerado na página Para a chefia.",
          "Clique em " + b("Salvar") + ".",
          "Clique em " + b("Assinar") + " (cargo/função e senha)."
        ],
        link: { href: "#/chefia", texto: "Gerar o texto do despacho (Para a chefia)" }
      },
      {
        fase: FC, titulo: "Encaminhe ou devolva",
        intro: "Pedido completo segue à Seção de Pessoal; pedido com pendência volta ao requerente.",
        tela: telaEnviar({ chave: "enviar-chefia", sugestao: "SIGLA DA UNIDADE DA SEÇÃO DE PESSOAL" }),
        acoes: [
          "Clique em " + b("Enviar Processo") + ". Em Unidades, escolha a " + b("Seção de Pessoal do " + CONFIG.unidadeSigla) + " (encaminhamento) ou a unidade do requerente (devolução).",
          "Marque " + b("Manter processo aberto na unidade atual") + " só se quiser acompanhar pela sua lista.",
          "Clique em " + b("Enviar") + "."
        ]
      }
    ];

    return { requerente: req, chefia: chefia, aviso: aviso };
  }

  return { roteiro: roteiro, anexosDe: anexosDe };
})();

</script>
<script>
/* =========================================================================
   CENTRAL DE REQUERIMENTOS — aplicação
   Para incluir ou excluir requerimentos, edite apenas o bloco de DADOS.
   ========================================================================= */
(function () {
  "use strict";

  const app = document.getElementById("app");
  const GUIA = {};
  GUIAS.forEach(function (g) { GUIA[g.id] = g; });
  const CAT = {};
  CATEGORIAS.forEach(function (c) { CAT[c.id] = c; });

  /* ------------------------------------------------------------------ */
  /* utilidades                                                          */
  /* ------------------------------------------------------------------ */
  const $ = function (s, r) { return (r || document).querySelector(s); };
  const $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  const esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  const norm = function (s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
  /* primeira letra minúscula, exceto em nome próprio de documento ("Nada Consta", "Anexo J",
     "Certidão de Tempo de Serviço", "Formulário para Assistência Médica"): a 2ª palavra, ou a 3ª
     depois de "de" ou "para", começa com maiúscula. "Certidão da Corregedoria…" fica minúscula. */
  const minusc = function (s) {
    if (!/^[A-ZÀ-Ý][a-zà-ÿ]/.test(s)) return s;
